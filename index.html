  // Projeção do ano em curso: cada mês que falta = mesmo mês do ano anterior × (1 + crescimento do acumulado do ano sobre os mesmos meses do ano anterior).
  // O mês em andamento usa a projeção pelo ritmo da aba Mês atual quando há leitura de todas as lojas.
  function projAno(loja) {
    const mg = dash.data('mensal');
    if (mg.status !== 'ok') return null;
    const R = mg.data.filter((r) => r.loja === loja);
    const ult = d3.max(R, (r) => r.ano); if (!ult) return null;
    const M = d3.max(R.filter((r) => r.ano === ult), (r) => r.mes_num);
    if (!M || M >= 12) return null;
    const v = (a, m) => { const x = R.find((r) => r.ano === a && r.mes_num === m); return x ? x.faturamento : null; };
    let real = 0, base = 0;
    for (let m = 1; m <= M; m++) { real += v(ult, m) || 0; base += v(ult - 1, m) || 0; }
    if (!(base > 0)) return null;
    const cresc = real / base - 1;
    const ac = dash.data('acomp');
    const meses = []; let ritmo = null;
    for (let m = M + 1; m <= 12; m++) {
      const mesK = `${ult}-${String(m).padStart(2, '0')}`;
      let f = null;
      if (ac.status === 'ok') {
        const rs = ac.data.filter((r) => r.mes === mesK && r.dias_rest > 0 && r.projecao != null && r.loja === loja);
        if (rs.length) { f = d3.sum(rs, (r) => r.projecao); ritmo = { mes: m, ate: d3.max(rs, (r) => r.data) }; }
      }
      if (f == null) { const b = v(ult - 1, m); if (b == null) continue; f = b * (1 + cresc); }
      meses.push({ ano: ult, mes_num: m, faturamento: f });
    }
    if (!meses.length) return null;
    const proj = d3.sum(meses, (r) => r.faturamento);
    const antTotal = d3.sum(R.filter((r) => r.ano === ult - 1), (r) => r.faturamento);
    const txtMetodo = `Como foi estimada: ${ritmo ? `${MESES[ritmo.mes - 1]} pelo ritmo da última leitura (${dBRy(ritmo.ate)}); ` : ''}os demais meses repetem o mesmo mês de ${ult - 1} com o crescimento do acumulado de ${ult} (${pct(cresc, true)}).`;
    return { ano: ult, M, real, cresc, meses, proj, total: real + proj, varAno: antTotal > 0 ? (real + proj) / antTotal - 1 : null, txtMetodo };
  }

  /* ---------- Aba Lojas ---------- */
  function renderLojas() {

    const rows = pl.data.filter((r) => r.ano === ano && r.mes === ate).sort((a, b) => b.acum_atual - a.acum_atual);
    const curto = estreito();
    const lab = (r) => curto ? r.loja : `${r.loja} ${r.nome}`;
    const abrir = (l) => { dash.setParams({ ano_ano: String(ano), ano_ate: String(ate), ano_loja: l }); showTab('ano', true); };
    const tit = $('#lj-titulo'), per = $('#lj-titulo-per'), nota = $('#lj-nota');

      const [rel, loja] = k.split('|');
      // Avisos agrupados por tipo: o que vale para todos os arquivos aparece uma vez; repetições e layout viram uma frase com a lista.
      const frases = new Set(), porArq = [], repetidos = new Set(), semPlano = [];
      for (const r of rs) {
        const arq = r.arquivo.split('/').pop();
        for (const s of String(r.aviso || '').split(' | ').filter(Boolean)) {
          if (/^Relatório sem data|^Ainda não lido/.test(s)) frases.add(s);
          else if (/^Período repetido/.test(s)) repetidos.add(arq);
          else if (/^Layout sem fornecedor/.test(s)) semPlano.push(arq);
          else porArq.push(`${arq}: ${s}`);
        }
      }
      if (semPlano.length) porArq.unshift(`${semPlano.length === rs.length ? 'Todos os arquivos' : semPlano.join(', ')}: layout sem fornecedor e sem plano de contas; não entra em Gastos até ser extraído no layout por plano de contas.`);
      if (repetidos.size) porArq.push(`Períodos que se repetem entre arquivos (${[...repetidos].join(', ')}): o que se repete conta uma vez.`);
      const ate = rs.map((r) => r.dados_ate).filter(Boolean).sort().pop() || null;

        const per = fl.map((r) => r.ini + '|' + r.fim).sort((a, b) => a.slice(0, 10).localeCompare(b.slice(0, 10)) || b.slice(11).localeCompare(a.slice(11)))[0];
        const cl = car.filter((r) => r.loja === loja && r.data.slice(0, 7) === mes);
        const de = per ? per.slice(0, 10) : mes + '-01', ate = per ? per.slice(11) : cl.map((r) => r.data).sort().pop();

        };
      }).map((r) => ({ ...r, ok: r.temNf && r.temCar && r.ele > 0, cob: r.temNf && r.ele > 0 ? r.fat / r.ele : null, gap: r.temNf && r.temCar ? Math.max(0, r.ele - r.fat) : null }));

  /* Projeção das notas de venda por empresa e risco de desenquadramento do Simples Nacional */
  // Limites da LC 123: sublimite de R$ 3,6 mi (acima dele o ICMS sai do DAS) e teto de R$ 4,8 mi; excesso de até 20% vale a partir
  // de janeiro do ano seguinte, acima de 20% a partir do mês seguinte ao excesso.
  const SN_LIM = { sub: 3600000, sub20: 4320000, teto: 4800000, teto20: 5760000 };
  const ftUteis = (mes, a, b) => { let c = 0; for (let i = a; i <= b; i++) if (new Date(mes + '-' + String(i).padStart(2, '0') + 'T12:00:00Z').getUTCDay() !== 0) c++; return c; };
  // Notas de venda mês a mês de cada empresa, de jan do ano passado a dez do ano que vem. Meses com relatório 07: as notas dele
  // (o mês em curso completado no mesmo ritmo). Sem 07: vendas do sistema × a parcela que hoje vira nota. Meses futuros: vendas do
  // mesmo mês do ano anterior × o crescimento do ano.
  function ftProjecao(emp, cenario) {
    const dd = (id) => { const x = dash.data(id); return x.status === 'ok' ? x.data : []; };
    const ven = new Map(), fat = new Map(), ele = new Map();
    for (const r of dd('erp_diario')) if (emp.lojas.includes(r.loja)) { const m = r.data.slice(0, 7); ven.set(m, (ven.get(m) || 0) + Number(r.valor)); }
    const ultDia = dd('erp_diario').filter((r) => emp.lojas.includes(r.loja)).map((r) => r.data).sort().pop();
    if (!ultDia) return null;
    const mesAt = ultDia.slice(0, 7), ano = Number(mesAt.slice(0, 4));
    const N = new Date(Date.UTC(ano, Number(mesAt.slice(5, 7)), 0)).getUTCDate();
    // parcela das vendas que vira nota, no período lido dos relatórios 07 e 08
    const ra = emp.vendas > 0 ? emp.fat / emp.vendas : 0, rc = emp.vendas > 0 ? Math.max(emp.fat, emp.ele) / emp.vendas : 0, r = cenario === "cobrir" ? rc : ra;
    // crescimento: vendas de jan até o último mês fechado contra o mesmo período do ano anterior
    const mm = (a, m) => `${a}-${String(m).padStart(2, '0')}`;
    let s1 = 0, s0 = 0; for (let m = 1; m < Number(mesAt.slice(5, 7)); m++) { s1 += ven.get(mm(ano, m)) || 0; s0 += ven.get(mm(ano - 1, m)) || 0; }
    const g = s0 > 0 ? s1 / s0 : 1;
    const vMes = (m) => {
      if (m < mesAt) return ven.get(m) || 0;
      if (m === mesAt) { const d = Number(ultDia.slice(8, 10)); return (ven.get(m) || 0) * ftUteis(m, 1, N) / Math.max(1, ftUteis(m, 1, d)); }
      const ant = mm(Number(m.slice(0, 4)) - 1, Number(m.slice(5, 7)));
      return (ant < mesAt ? ven.get(ant) || 0 : vMes(ant)) * g;
    };
    const out = new Map();
    for (let a = ano - 1; a <= ano + 1; a++) for (let m = 1; m <= 12; m++) { const k = mm(a, m); out.set(k, vMes(k) * (k >= mesAt ? r : ra)); }
    // mês em curso com relatório 07: as notas reais completadas no ritmo do período
    if (emp.temNf && emp.ate && emp.ate.slice(0, 7) === mesAt && cenario !== 'cobrir') {
      const d = Number(emp.ate.slice(8, 10)); out.set(mesAt, emp.fat * ftUteis(mesAt, 1, N) / Math.max(1, ftUteis(mesAt, 1, d)));
    }
    return { mes: mesAt, ano, g, r, m: out, total: (a) => [...out].filter(([k]) => k.startsWith(a + '-')).reduce((s, [, v]) => s + v, 0),
      rbt12: (mes) => { let s = 0; const [y, mo] = mes.split('-').map(Number); for (let i = 1; i <= 12; i++) { const dt = new Date(Date.UTC(y, mo - 1 - i, 1)); s += out.get(dt.toISOString().slice(0, 7)) || 0; } return s; },
      cruza: (a, lim) => { let s = 0; for (let m = 1; m <= 12; m++) { s += out.get(mm(a, m)) || 0; if (s > lim) return mm(a, m); } return null; } };
  }
  function ftSitSimples(p, a) {
    const t = p.total(a), prox = a + 1;
    if (t > SN_LIM.teto20) return { sev: 5, cls: "bad", txt: `Passa de R$ 5,76 mi (${mesNome(p.cruza(a, SN_LIM.teto20))}): sai do Simples no mês seguinte` };
    if (t > SN_LIM.teto) return { sev: 4, cls: "bad", txt: `Passa de R$ 4,8 mi: sai do Simples em jan/${prox}` };
    if (t > SN_LIM.sub20) return { sev: 3, cls: "bad", txt: `Passa de R$ 4,32 mi (${mesNome(p.cruza(a, SN_LIM.sub20))}): ICMS sai do DAS no mês seguinte` };
    if (t > SN_LIM.sub) return { sev: 2, cls: "mid", txt: `Passa de R$ 3,6 mi: ICMS sai do DAS em jan/${prox}` };
    if (t > SN_LIM.sub * 0.85) return { sev: 1, cls: "mid", txt: `Perto do sublimite (${pct0(t / SN_LIM.sub)} de R$ 3,6 mi)` };
    return { sev: 0, cls: "ok", txt: `Dentro dos limites (${pct0(t / SN_LIM.sub)} do sublimite)` };
  }
  function renderProjecao(rows) {
    const simples = rows.filter((e) => e.regime === 'Simples' && e.temNf);
    const L = simples.map((e) => ({ e, at: ftProjecao(e, 'atual'), cb: ftProjecao(e, 'cobrir') })).filter((l) => l.at);
    if (!L.length) { $('#ft-proj-nota').textContent = 'Sem relatório 07 das empresas do Simples no mês.'; fillTable($('#ft-proj-tab'), [], []); return; }
    const ano = L[0].at.ano;
    for (const [id, t] of [['ft-pj-a', `${ano}, ritmo atual`], ["ft-pj-b", `${ano}, cobrindo desde ${MESES[Number(L[0].at.mes.slice(5, 7)) - 1]}`], ['ft-pj-c', `${ano + 1}, ritmo atual`], ["ft-pj-d", `${ano + 1}, cobrindo o ano todo`]]) $('#' + id).textContent = t;
    const cel = (p, a) => ({ cls: (l) => ftSitSimples(l[p], a).cls, fmt: (l) => money(l[p].total(a)) });
    fillTable($('#ft-proj-tab'), L, [
      { cls: 'l nm', fmt: (l) => ftNome(l.e) },
      { fmt: (l) => `${pct0(l.at.r)} · ${pct0(l.cb.r)}` },
      cel('at', ano), cel('cb', ano), cel('at', ano + 1), cel('cb', ano + 1),

    ]);
    // Ícone ⓘ: leitura dos limites de cada empresa nos quatro cenários
    const cen = [['at', ano, `${ano}, ritmo atual`], ['cb', ano, `${ano}, cobrindo o cartão e o Pix desde ${MESES[Number(L[0].at.mes.slice(5, 7)) - 1]}`], ['at', ano + 1, `${ano + 1}, ritmo atual`], ['cb', ano + 1, `${ano + 1}, cobrindo o cartão e o Pix o ano todo`]];
    [...$('#ft-proj-tab').tBodies[0].rows].forEach((tr, i) => {
      const l = L[i]; if (!l) return;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'bd-info'; b.textContent = 'i'; b.title = 'Leitura da empresa'; b.setAttribute('aria-label', 'Leitura de ' + ftNome(l.e));
      b.addEventListener('click', () => {
        const dlg = $('#ft-dlg'), p = cen.map(([k, a, nome]) => `${nome}: ${money(l[k].total(a))} em notas. ${ftSitSimples(l[k], a).txt}.`);
        p.unshift(`Hoje ${pct0(l.at.r)} das vendas do sistema saem em nota; cobrindo o cartão e o Pix, seriam ${pct0(l.cb.r)}. Crescimento de vendas do ano: ${pct(l.at.g - 1, true)}.`);
        p.push('Limites do Simples por empresa (matriz e filiais juntas): R$ 3,6 mi (acima, o ICMS sai do DAS) e R$ 4,8 mi (acima, a empresa sai do Simples). Passando em até 20%, vale no ano seguinte; acima de 20%, no mês seguinte. Também conta a receita global das empresas em que um mesmo sócio tem mais de 10%.');
        dlg.querySelector('h3').textContent = ftNome(l.e);
        dlg.querySelector('.txt').replaceChildren(...p.map((t) => Object.assign(document.createElement('p'), { textContent: t })));
        if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
      });
      tr.cells[tr.cells.length - 1].replaceChildren(b);
    });
    const riscos = L.filter((l) => [[l.at, ano], [l.cb, ano], [l.at, ano + 1], [l.cb, ano + 1]].some(([p, a]) => p.total(a) > SN_LIM.sub));
    $('#ft-proj-tit').textContent = riscos.length ? `${riscos.map((l) => l.e.lojas.join('+')).join(', ')} com risco de passar do sublimite ou do teto` : 'Nenhuma empresa do Simples perto dos limites';
    $('#ft-proj-nota').textContent = `Notas de venda projetadas por empresa (matriz e filiais juntas). A coluna "Vira nota" é a parcela das vendas do sistema que hoje sai em nota e a que sairia cobrindo o cartão e o Pix, medidas no período lido (${dBR(simples[0].de)} a ${dBR(simples[0].ate)}). `
      + `Meses sem relatório 07 usam essa parcela sobre as vendas do sistema; no cenário "cobrindo", os meses que já passaram ficam como foram e só daqui em diante as notas cobrem o cartão e o Pix; ${ano + 1} repete ${ano} com o crescimento de vendas do ano (${L.map((l) => `${l.e.lojas.join('+')} ${pct(l.at.g - 1, true)}`).join(', ')}). `
      + 'Limites: até R$ 3,6 mi tudo no DAS; acima, o ICMS sai do DAS; acima de R$ 4,8 mi a empresa sai do Simples. Passando em até 20%, vale no ano seguinte; acima de 20%, no mês seguinte.';
    // Receita global: o Simples também olha a soma das empresas em que um mesmo sócio tem mais de 10% (LC 123, art. 3º, § 4º)
    const glob = rows.filter((e) => e.temNf).map((e) => ({ e, p: ftProjecao(e, 'atual') })).filter((x) => x.p);
    const tg = glob.reduce((s, x) => s + x.p.total(ano), 0);
    $('#ft-proj-glob').textContent = `Atenção à receita global: o Simples também soma a receita das empresas em que um mesmo sócio tem mais de 10% do capital (LC 123, art. 3º, § 4º). As notas projetadas de ${ano} de todas as empresas lidas somam ${money(tg)}${tg > SN_LIM.teto ? ', acima de R$ 4,8 mi' : ''}. Conferir com a contabilidade o quadro societário de cada CNPJ do Simples.`;
  }

  /* ---------- Relatórios: acompanhamento da rotina de envio (segunda: até o sábado; quinta: até a quarta) ---------- */
  const RL_REL = [
    { rel: '01', nome: 'Vendas (resumo)', cad: 'sem' }, { rel: '03', nome: 'Lucratividade (custo)', cad: 'sem' }, { rel: '06', nome: 'Formas de pagamento', cad: 'sem' },
    { rel: '07', nome: 'Notas fiscais (CFOP)', cad: 'sem' }, { rel: '08', nome: 'Cartão e Pix (Rede)', cad: 'sem' }, { rel: '05', nome: 'Contas pagas', cad: 'sem', util: true },
    { rel: '13', nome: 'Contas a receber em aberto', cad: 'sem' }, { rel: '14', nome: 'Contas a pagar em aberto', cad: 'sem' },
    { rel: '12', nome: 'Transferências', cad: 'sem', todas: true }, { rel: '02', nome: 'Produtos', cad: 'mes' }, { rel: '10', nome: 'Estoque', cad: 'mes' },
  ];
  const RL_LOJAS = ['L2', 'L3', 'L4', 'L5', 'L7/L10', 'L8', 'L9'];
  const iso = (d) => d.toISOString().slice(0, 10);
  const addD = (s, n) => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
  const dowS = (s) => new Date(s + 'T12:00:00Z').getUTCDay();
  const SEM3 = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  // Leitura esperada hoje: de segunda a quarta, o último sábado; de quinta a domingo, a última quarta
  function rlEsperada(hoje) {
    const w = dowS(hoje);
    const esp = w >= 1 && w <= 3 ? addD(hoje, -(w + 1)) : addD(hoje, -((w + 7 - 3) % 7));
    const ant = dowS(esp) === 6 ? addD(esp, -3) : addD(esp, -4);   // a leitura anterior (quarta antes do sábado, sábado antes da quarta)
    const prox = w === 1 || w === 4 ? hoje : addD(hoje, w < 4 ? 4 - w : (8 - w) % 7 || 7);
    const proxAte = dowS(prox) === 1 ? addD(prox, -2) : addD(prox, -1);
    return { esp, ant, diaSubida: w === 1 || w === 4, prox, proxAte };
  }
  function renderRelatorios() {
    const inv = dash.data('erp_arquivos'); if (inv.status !== 'ok') return;
    const hoje = iso(new Date(Date.now() - new Date().getTimezoneOffset() * 6e4));
    const E = rlEsperada(hoje);
    const mesAnt = (() => { const d = new Date(hoje + 'T12:00:00Z'); d.setUTCDate(0); return iso(d).slice(0, 7); })();
    // último dia com dados e último arquivo salvo por relatório e loja; avisos dos arquivos salvos nos últimos 7 dias
    const ult = new Map(), avisos = [];
    for (const r of inv.data) {
      let ate = r.dados_ate || (r.periodo_fim ? (r.ate_dia ? `${r.periodo_fim}-${String(r.ate_dia).padStart(2, '0')}` : r.periodo_fim) : '');
      // relatório semanal sem data por linha: vale o dia anterior ao salvamento, sem passar do período do nome
      if (ate.length === 7 && RL_REL.some((x) => x.rel === r.relatorio && x.cad === 'sem') && r.salvo_em) ate = [addD(r.salvo_em, -1), addD(ate + '-01', 40).slice(0, 7) + '-01'].sort()[0];
      for (const lj of String(r.loja || '').split(',').map((s) => s.trim()).filter(Boolean)) {
        const k = r.relatorio + '|' + lj, o = ult.get(k) || { ate: '', salvo: '' };
        if (ate > o.ate) o.ate = ate; if (r.salvo_em > o.salvo) o.salvo = r.salvo_em; ult.set(k, o);
      }
      if (r.salvo_em >= addD(hoje, -7) && /cabeçalho|exportada duas vezes|não reconhecid|vazio|na pasta|Erro ao ler/i.test(r.aviso || ''))
        avisos.push(`${r.relatorio} · ${r.loja || 'loja ?'} · ${r.arquivo.split('/').pop()}: ${r.aviso.split(' | ').filter((a) => /cabeçalho|duas vezes|reconhecid|vazio|na pasta|Erro ao ler/i.test(a)).join(' ')}`);
    }
    const cel = (R, lj) => {
      if (R.rel === '08' && lj === 'L9') return { st: 'na', txt: 'pela L5' };
      const o = ult.get(R.rel + '|' + (R.todas ? 'Todas' : lj));
      if (!o || !o.ate) return { st: 'bad', txt: 'Sem arquivo', o };
      if (R.cad === 'mes') { const m = o.ate.slice(0, 7); return { st: m >= mesAnt ? 'ok' : 'bad', txt: o.ate.length > 7 ? dBRy(o.ate) : mesNome(m), o }; }
      // contas pagas: sem pagamento no sábado, vale a sexta
      const ut = (s) => R.util && dowS(s) === 6 ? addD(s, -1) : s, esp = ut(E.esp);
      const st = o.ate >= esp ? 'ok' : E.diaSubida && o.ate >= ut(E.ant) ? 'mid' : 'bad';
      return { st, txt: dBR(o.ate), o, atraso: st === 'bad' ? Math.round((new Date(esp) - new Date(o.ate)) / 864e5) : 0 };
    };
    const linhas = RL_REL.map((R) => ({ R, c: (R.todas ? ['Todas'] : RL_LOJAS).map((lj) => ({ lj, ...cel(R, lj) })) }));
    const todas = linhas.flatMap((l) => l.c.filter((c) => c.st !== 'na').map((c) => ({ ...c, R: l.R })));
    const sem = todas.filter((c) => c.R.cad === 'sem'), mens = todas.filter((c) => c.R.cad === 'mes');
    const nOk = sem.filter((c) => c.st === 'ok').length, nBad = sem.filter((c) => c.st === 'bad'), nMid = sem.filter((c) => c.st === 'mid');
    const mensBad = mens.filter((c) => c.st === 'bad');
    $('#rl-quem').textContent = `hoje, ${SEM3[dowS(hoje)]} ${dBRy(hoje)}`;
    $('#rl-headline').textContent = nBad.length === 0 && nMid.length === 0 ? `Relatórios semanais em dia para a leitura de ${SEM3[dowS(E.esp)]} ${dBR(E.esp)}.`
      : `${nOk} de ${sem.length} relatórios semanais em dia para a leitura de ${SEM3[dowS(E.esp)]} ${dBR(E.esp)}${nBad.length ? `; ${nBad.length} atrasados` : ''}${nMid.length ? `; ${nMid.length} sobem hoje` : ''}.`;
    const porRel = [...new Set(nBad.map((c) => c.R.rel))];
    $('#rl-comp').textContent = (porRel.length ? `Atrasados: ${porRel.map((r) => r + ' ' + RL_REL.find((x) => x.rel === r).nome).join(', ')}. ` : '')

      + (mensBad.length ? ` Mensais pendentes: ${[...new Set(mensBad.map((c) => c.R.rel + ' ' + c.R.nome))].join(', ')}.` : '');
    const kp = (k, v) => { const el = $(`#relatorios [data-rl="${k}"]`); if (el) el.textContent = v; };

    $('#relatorios [data-rl="bad"]').className = 'val ' + (nBad.length ? 'down' : 'up');
    kp('esp', `${SEM3[dowS(E.esp)]} ${dBR(E.esp)}`); kp('esp_sub', 'dados até este dia (semanais)');
    kp('prox', `${SEM3[dowS(E.prox)]} ${dBR(E.prox)}`); kp('prox_sub', `com os dados até ${SEM3[dowS(E.proxAte)]} ${dBR(E.proxAte)}`);

      const cs = mensBad.filter((c) => c.R.rel === r);
      itens.push([`${r} ${cs[0].R.nome} (mensal): `, `esperado ${mesNome(mesAnt)} · ${cs.map((c) => `${c.lj} ${!c.o || !c.o.ate ? 'sem arquivo' : c.txt}`).join(', ')}.`]);

    }));

    for (const h of ['Relatório', ...RL_LOJAS]) { const th = document.createElement('th'); th.textContent = h; if (h === 'Relatório') th.className = 'l'; trh.append(th); }
    t.tHead.replaceChildren(trh);
    const marca = { ok: '● ', mid: '◐ ', bad: '○ ', na: '' };
    t.tBodies[0].replaceChildren(...linhas.map(({ R, c }) => {
      const tr = document.createElement('tr');
      const td0 = document.createElement('td'); td0.className = 'l nm'; td0.textContent = `${R.rel} · ${R.nome}${R.cad === 'mes' ? ' (mensal)' : ''}`; tr.append(td0);
      c.forEach((x, i) => {
        const td = document.createElement('td'); td.dataset.label = R.todas ? 'Todas as lojas' : RL_LOJAS[i];

      for (let m = Number(r.per_ini.slice(5, 7)); m <= Number(r.per_fim.slice(5, 7)); m++) o.meses.add(m);
    }
    const anoAtual = Number((ultLeit || '2026').slice(0, 4));

    fillTable($('#tab-markup'), rows, [

<script>
  /* Entrada da versão web: 1) conta Google autorizada encontra o arquivo no Drive; 2) a senha destranca no próprio aparelho. */
  (function () {

    async function sessaoLembrada() {
      try { const s = await idb.get('sessao'), k = await idb.get('chave'); if (!s || !k || s.ate < Date.now()) return null;
        return { s, senha: new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: s.iv }, k, s.ct)) }; } catch (e) { return null; }
    }
    const guardarDados = (env, versao) => { if (lembrando()) idb.set('dados', { env, versao }); };
    async function esquecerSessao() { await idb.del('sessao'); await idb.del('dados'); }
    let lembrarSessao = true;
    const lembrando = () => lembrarSessao;

    // Faixa discreta quando o acesso do Google expira: o painel continua aberto; um toque renova e busca os dados novos.
    function mostrarRenovar(txt) {
      let b = document.getElementById('web-renovar');
      if (!b) {
        b = document.createElement('div'); b.id = 'web-renovar'; b.setAttribute('role', 'status');
        const t = document.createElement('span'), ok = document.createElement('button'), x = document.createElement('button');
        ok.type = 'button'; ok.textContent = 'Buscar dados novos'; ok.addEventListener('click', () => pedirToken(false, true));
        x.type = 'button'; x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', 'Fechar'); x.addEventListener('click', () => { b.hidden = true; });
        b.append(t, ok, x); document.body.append(b);
      }
      b.firstChild.textContent = txt || `Dados de ${dBR(window.dash && window.dash.geradoEm)}.`;
      b.hidden = false;
    }
    function esconderRenovar() { const b = document.getElementById('web-renovar'); if (b) b.hidden = true; }

    async function api(url) {
      const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
      if (r.status === 401) { esquecerToken(); throw Object.assign(new Error('expirou'), { codigo: 401 }); }
      if (!r.ok) throw Object.assign(new Error('Drive ' + r.status), { codigo: r.status });
      return r;
    }

    let cliente = null;
    // so = só renovar o acesso com o painel aberto (sem abrir a tela de entrada): depois confere se há dados novos
    let depoisDoToken = null;
    function pedirToken(trocar, so) {
      depoisDoToken = so && montado ? () => conferirNovidade(true) : null;
      if (!CFG.CLIENT_ID || /COLE_AQUI/.test(CFG.CLIENT_ID)) { aviso('O acesso pelo Google ainda não foi configurado (falta o CLIENT_ID no config.js). Use "Abrir arquivo do aparelho".', true); return; }
      if (!window.google || !google.accounts || !google.accounts.oauth2) { aviso('Carregando o login do Google… tente de novo em alguns segundos. Sem internet, o painel não abre.', true); return; }
      if (!cliente) cliente = google.accounts.oauth2.initTokenClient({
        client_id: CFG.CLIENT_ID, scope: ESCOPO,
        callback: (r) => { if (r.error) { aviso('O Google não liberou o acesso (' + r.error + ').', true); if (montado) mostrarRenovar('O Google não liberou o acesso agora.'); return; }
          guardarToken(r.access_token, Number(r.expires_in) || 3600); const f = depoisDoToken; depoisDoToken = null; if (f) f(); else buscar(); },
        error_callback: (e) => { if (montado && depoisDoToken) { depoisDoToken = null; mostrarRenovar('A janela do Google foi fechada. Os dados continuam os mesmos.'); return; } aviso(e && e.type === 'popup_closed' ? 'A janela do Google foi fechada antes de terminar.' : 'Não foi possível abrir o login do Google. Se o navegador bloqueou a janela, permita e toque de novo.', true); },
      });
      cliente.requestAccessToken({ prompt: trocar ? 'select_account' : '', login_hint: !trocar && conta ? conta : undefined });
    }

    async function buscar() {
      passo('nenhum'); progresso(0); aviso('Procurando o arquivo do painel no Google Drive…');
      try {
        try { const u = await (await api('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress,displayName)')).json(); conta = (u.user && u.user.emailAddress) || ''; nomeConta = (u.user && u.user.displayName) || conta; } catch (e) { if (e.codigo === 401) throw e; }
        let q = `name = '${CFG.ARQUIVO.replace(/'/g, "\\'")}' and trashed = false`;
        if (CFG.PASTA_ID) q += ` and '${CFG.PASTA_ID}' in parents`;
        const lista = await (await api('https://www.googleapis.com/drive/v3/files?' + new URLSearchParams({ q, orderBy: 'modifiedTime desc', pageSize: '5', fields: 'files(id,modifiedTime,size)', supportsAllDrives: 'true', includeItemsFromAllDrives: 'true' }))).json();
        const arq = (lista.files || [])[0];
        if (arq) versaoBaixada = arq.modifiedTime;
        if (!arq) { progresso(null); passo('entrar'); $('gt-trocar').hidden = false;
          aviso(`A conta ${conta || 'escolhida'} não tem acesso ao painel. Entre com a conta autorizada ou peça a liberação para quem administra o painel.`, true); return; }
        const r = await api(`https://www.googleapis.com/drive/v3/files/${arq.id}?alt=media&supportsAllDrives=true`);
        const total = Number(r.headers.get('content-length')) || Number(arq.size) || 0;
        let txt;
        if (r.body && r.body.getReader && total) {
          const leitor = r.body.getReader(), partes = []; let lido = 0;
          for (;;) { const { done, value } = await leitor.read(); if (done) break; partes.push(value); lido += value.length; progresso(Math.min(1, lido / total)); aviso(`Baixando os dados trancados… ${(lido / 1048576).toFixed(1)} de ${(total / 1048576).toFixed(1)} MB`); }
          txt = new TextDecoder().decode(await new Blob(partes).arrayBuffer());
        } else txt = await r.text();
        receber(txt);
      } catch (e) {
        progresso(null); passo('entrar');
        if (e.codigo === 401) aviso('O acesso do Google expirou. Toque em "Entrar com Google" de novo.', true);
        else if (e.codigo === 403) aviso('O Google recusou o acesso ao Drive desta conta. Confira se ela foi cadastrada como autorizada.', true);
        else aviso('Não foi possível ler o Google Drive agora (' + e.message + '). Confira a internet e tente de novo.', true);
      }
    }

    function receber(txt) {
      progresso(null);
      try { envelope = JSON.parse(String(txt).replace(/^﻿/, '')); } catch (e) { envelope = null; }
      if (!envelope || envelope.v !== 1 || !envelope.ct) { passo('entrar'); aviso('Este arquivo não é o arquivo trancado do painel.', true); return; }
      if (senhaSessao) { abrir(senhaSessao, true); return; }
      $('gt-info').innerHTML = '';
      $('gt-info').append(document.createTextNode('Dados de '), Object.assign(document.createElement('b'), { textContent: dBR(envelope.gerado_em) }), document.createTextNode(conta ? ' · conta ' + conta : ''));
      passo('senha'); aviso('');
    }

    const b64 = (s) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
    async function destrancar(env, senha) {
      const sub = crypto.subtle, sal = b64(env.salt), iv = b64(env.iv), ct = b64(env.ct), mac = b64(env.mac);
      const base = await sub.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
      const bits = new Uint8Array(await sub.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: sal, iterations: env.iter }, base, 512));
      const kMac = await sub.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
      const juntos = new Uint8Array(iv.length + ct.length); juntos.set(iv); juntos.set(ct, iv.length);
      if (!(await sub.verify('HMAC', kMac, mac, juntos))) return null;
      const kEnc = await sub.importKey('raw', bits.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
      return JSON.parse(new TextDecoder().decode(await sub.decrypt({ name: 'AES-CBC', iv }, kEnc, ct)));
    }

    async function abrir(senha, troca) {
      if (!window.crypto || !crypto.subtle) { aviso('Este navegador não consegue destrancar os dados. Use Chrome, Safari ou Edge atualizados.', true); return; }
      $('gt-abrir').disabled = true; aviso('Destrancando…');
      let dados = null;
      try { dados = await destrancar(envelope, senha); } catch (e) { dados = null; }
      $('gt-abrir').disabled = false;
      if (!dados) {
        const lembrada = senhaSessao && senha === senhaSessao;
        senhaSessao = null; if (lembrada) esquecerSessao();
        passo('senha'); aviso(lembrada ? 'A senha do painel mudou: digite a senha nova.' : 'Senha incorreta.', true); $('gt-pw').select(); return;
      }
      lembrarSessao = $('gt-lembrar') ? $('gt-lembrar').checked : true;
      if (lembrarSessao) { lembrar(senha); guardarDados(envelope, versaoBaixada); } else esquecerSessao();
      senhaSessao = senha; envelope = null; versaoCarregada = versaoBaixada;
      if (troca && montado) { window.dash.__trocar(dados); fechar(); return; }
      montar(dados);
    }

    function montar(dados) {
      aviso('Montando o painel…');
      window.__montarDash(dados);
      const frag = $('tpl-painel').content.cloneNode(true);
      frag.querySelectorAll('script').forEach((s) => { const n = document.createElement('script'); n.textContent = s.textContent; s.replaceWith(n); });
      $('app').append(frag);
      montado = true; $('gt-voltar').hidden = false;
      const g = document.getElementById('gerado-em'); if (g) g.textContent = window.dash.geradoEm || '—';
      fechar();
    }
    $('gt-voltar').addEventListener('click', () => fechar());
    function fechar() { gate.hidden = true; document.body.classList.remove('gt-on'); $('gt-pw').value = ''; aviso(''); window.scrollTo(0, 0); }

    // Tranca um objeto com a senha da sessão, no mesmo formato do arquivo do painel (PBKDF2 + AES-256-CBC + HMAC-SHA256)
    async function trancar(obj, senha) {
      const sub = crypto.subtle, sal = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(16)), iter = 310000;
      const base = await sub.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
      const bits = new Uint8Array(await sub.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: sal, iterations: iter }, base, 512));
      const kEnc = await sub.importKey('raw', bits.slice(0, 32), { name: 'AES-CBC' }, false, ['encrypt']);
      const ct = new Uint8Array(await sub.encrypt({ name: 'AES-CBC', iv }, kEnc, new TextEncoder().encode(JSON.stringify(obj))));
      const kMac = await sub.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
      const juntos = new Uint8Array(iv.length + ct.length); juntos.set(iv); juntos.set(ct, iv.length);
      const mac = new Uint8Array(await sub.sign('HMAC', kMac, juntos));
      const b = (u) => { let s = ''; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); };
      return { v: 1, alg: 'AES-256-CBC+HMAC-SHA256', kdf: 'PBKDF2-SHA256', iter, gerado_em: new Date().toISOString().slice(0, 16).replace('T', ' '), salt: b(sal), iv: b(iv), ct: b(ct), mac: b(mac) };
    }

    // Central Comercial: arquivo trancado na mesma pasta do Drive. Lê com a permissão de leitura; grava só quem é Editor da pasta,
    // com uma permissão extra do Google pedida na primeira gravação (a leitura continua só com drive.readonly).
    const CENTRAL = 'central_bin.enc.json', ESCOPO_GRAVAR = 'https://www.googleapis.com/auth/drive';
    let tokenGravar = null, clienteGravar = null, pedindo = null;
    function pedirTokenGravar() {
      if (tokenGravar) return Promise.resolve(tokenGravar);
      if (pedindo) return pedindo;
      pedindo = new Promise((ok, falha) => {
        if (!window.google || !google.accounts || !google.accounts.oauth2) { falha(Object.assign(new Error('sem login do Google'), { code: 'sem_google' })); return; }
        clienteGravar = google.accounts.oauth2.initTokenClient({ client_id: CFG.CLIENT_ID, scope: ESCOPO_GRAVAR, include_granted_scopes: true,
          callback: (r) => { pedindo = null; if (r.error || !r.access_token) falha(Object.assign(new Error(r.error || 'negado'), { code: 'negado' })); else { tokenGravar = r.access_token; setTimeout(() => { tokenGravar = null; }, ((Number(r.expires_in) || 3600) - 60) * 1000); ok(tokenGravar); } },
          error_callback: () => { pedindo = null; falha(Object.assign(new Error('janela fechada'), { code: 'negado' })); } });
        clienteGravar.requestAccessToken({ prompt: '', login_hint: conta || undefined });
      });
      return pedindo;
    }
    async function acharCentral() {
      let q = `name = '${CENTRAL}' and trashed = false`; if (CFG.PASTA_ID) q += ` and '${CFG.PASTA_ID}' in parents`;
      const l = await (await api('https://www.googleapis.com/drive/v3/files?' + new URLSearchParams({ q, orderBy: 'modifiedTime desc', pageSize: '3', fields: 'files(id,modifiedTime,capabilities(canEdit))', supportsAllDrives: 'true', includeItemsFromAllDrives: 'true' }))).json();
      return (l.files || [])[0] || null;
    }

    // Usado pelo botão "Atualizar dados" do painel: baixa de novo o arquivo do Drive e troca os números sem pedir a senha outra vez.
    // Atualização automática: a cada 5 minutos (e ao voltar para o app no celular) confere se o arquivo do Drive é mais novo
    // que o carregado; se for, baixa, destranca com a senha da sessão e troca os números na tela, sem pedir nada.
    let conferindo = false;
    function avisoNovo(txt) {
      let t = document.getElementById('web-novo');
      if (!t) { t = document.createElement('div'); t.id = 'web-novo'; t.setAttribute('role', 'status'); document.body.append(t); }
      t.textContent = txt; t.hidden = false; clearTimeout(t._tm); t._tm = setTimeout(() => { t.hidden = true; }, 8000);
    }
    // Leitura pelo link fixo (arquivo compartilhado por link + chave de API do site): não depende do acesso do Google, que vence em 1 hora.
    // O arquivo continua trancado com a senha. Sem a chave configurada, a conferência usa o acesso do Google, como antes.
    const PUBLICO = !!(CFG.API_KEY && CFG.ARQUIVO_ID);
    async function lerPublico(sufixo) {
      const r = await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(CFG.ARQUIVO_ID)}?${sufixo}&key=${encodeURIComponent(CFG.API_KEY)}`, { cache: 'no-store' });
      if (!r.ok) throw Object.assign(new Error('Drive ' + r.status), { codigo: r.status, publico: true });
      return r;
    }
    // forcado = pedido pelo botão (mostra o resultado mesmo sem novidade)
    async function conferirNovidade(forcado) {
      if (conferindo || !montado || !senhaSessao || (document.hidden && !forcado)) return;
      const pelaChave = PUBLICO;
      if (!pelaChave && !token) { token = tokenGuardado(); if (!token) { mostrarRenovar(); return; } }
      conferindo = true;
      try {
        let f;
        if (pelaChave) f = await (await lerPublico('fields=id,modifiedTime&supportsAllDrives=true')).json();
        else {
          let q = `name = '${CFG.ARQUIVO.replace(/'/g, "\'")}' and trashed = false`;
          if (CFG.PASTA_ID) q += ` and '${CFG.PASTA_ID}' in parents`;
          const l = await (await api('https://www.googleapis.com/drive/v3/files?' + new URLSearchParams({ q, orderBy: 'modifiedTime desc', pageSize: '1', fields: 'files(id,modifiedTime)', supportsAllDrives: 'true', includeItemsFromAllDrives: 'true' }))).json();
          f = (l.files || [])[0];
        }
        esconderRenovar();
        if (!f || (versaoCarregada && f.modifiedTime <= versaoCarregada)) { if (forcado) avisoNovo(`O painel já está com os dados mais recentes (${dBR(window.dash && window.dash.geradoEm)}).`); return; }
        if (forcado) avisoNovo('Baixando os dados novos…');
        const env = pelaChave ? await (await lerPublico('alt=media&supportsAllDrives=true')).json()
          : await (await api(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media&supportsAllDrives=true`)).json();
        const dados = await destrancar(env, senhaSessao);
        if (!dados) { avisoNovo('A senha do painel mudou: toque em Sair e entre com a senha nova.'); return; }
        versaoCarregada = f.modifiedTime; guardarDados(env, f.modifiedTime);
        window.dash.__trocar(dados);
        avisoNovo(`Dados atualizados agora (versão de ${dBR(dados.gerado_em || '')}).`);
      } catch (e) {
        if (e.publico && (e.codigo === 403 || e.codigo === 404)) { if (forcado) avisoNovo('O link do arquivo do painel não está liberado (compartilhamento ou chave de API). Avise quem administra o painel.'); }
        else if (e.codigo === 401) mostrarRenovar('O acesso do Google expirou. Os dados continuam na tela.');
        else if (forcado) avisoNovo('Não foi possível ler o Google Drive agora. Confira a internet.');
      }
      finally { conferindo = false; }
    }
    // Com o link fixo, confere a cada minuto (só a data do arquivo; baixa só quando muda); sem ele, a cada 5 minutos
    setInterval(conferirNovidade, (PUBLICO ? 1 : 5) * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) conferirNovidade(); });

    window.BIN_WEB = {
      get conta() { return conta; },
      get nome() { return nomeConta || conta; },
      // Chamar de forma síncrona no toque do botão: abre a janela de permissão do Google antes de qualquer espera
      prepararGravacao() { return pedirTokenGravar(); },
      // { dados, podeEscrever, versao }: dados = null quando o arquivo ainda não existe
      async lerCentral() {
        if (!token || !senhaSessao) return { dados: null, podeEscrever: false };
        const f = await acharCentral();
        let podeEscrever = !!(f && f.capabilities && f.capabilities.canEdit);
        if (!f && CFG.PASTA_ID) { try { const p = await (await api(`https://www.googleapis.com/drive/v3/files/${CFG.PASTA_ID}?fields=capabilities(canAddChildren)&supportsAllDrives=true`)).json(); podeEscrever = !!(p.capabilities && p.capabilities.canAddChildren); } catch (e) {} }
        if (!f) return { dados: null, podeEscrever, versao: null };
        const env = await (await api(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media&supportsAllDrives=true`)).json();
        let dados = null; try { dados = await destrancar(env, senhaSessao); } catch (e) { dados = null; }
        return { dados, podeEscrever, versao: f.modifiedTime, id: f.id, senhaErrada: !dados };
      },
      // Pede a permissão de gravação (precisa vir de um toque do usuário) e grava o objeto inteiro, trancado
      async gravarCentral(obj) {
        if (!senhaSessao) throw Object.assign(new Error('sem senha'), { code: 'invalid_argument' });
        const tk = await pedirTokenGravar();
        const env = await trancar(obj, senhaSessao);
        const f = await acharCentral();
        const corpo = JSON.stringify(env);
        let r;
        if (f) r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media&supportsAllDrives=true`, { method: 'PATCH', headers: { Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' }, body: corpo });
        else {
          const meta = { name: CENTRAL, mimeType: 'application/json', parents: CFG.PASTA_ID ? [CFG.PASTA_ID] : undefined };
          const fd = new FormData(); fd.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' })); fd.append('file', new Blob([corpo], { type: 'application/json' }));
          r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true', { method: 'POST', headers: { Authorization: 'Bearer ' + tk }, body: fd });
        }
        if (r.status === 401) { tokenGravar = null; throw Object.assign(new Error('expirou'), { code: 'expirou' }); }
        if (r.status === 403 || r.status === 404) throw Object.assign(new Error('sem permissão'), { code: 'invalid_argument' });
        if (!r.ok) throw Object.assign(new Error('Drive ' + r.status), { code: 'erro' });
        return true;
      },
      // Botão "Buscar versão nova": com o painel aberto, busca sem sair da tela; sem acesso do Google, renova com um toque
      recarregar() {
        if (montado && senhaSessao) { if (PUBLICO || token || (token = tokenGuardado())) conferirNovidade(true); else pedirToken(false, true); return; }
        gate.hidden = false; document.body.classList.add('gt-on');
        if (token) buscar(); else { passo('entrar'); aviso(''); }
      },
      // Sair: apaga a sessão lembrada, os dados guardados e o acesso do Google deste aparelho
      async sair() {
        try { if (token && window.google && google.accounts && google.accounts.oauth2) google.accounts.oauth2.revoke(token, () => {}); } catch (e) {}
        esquecerToken(); senhaSessao = null; await esquecerSessao();
        try { sessionStorage.removeItem('bin_params'); } catch (e) {}
        location.replace(location.pathname);
      },
    };

    $('gt-google').addEventListener('click', () => pedirToken(false));
    $('gt-trocar').addEventListener('click', () => { esquecerToken(); pedirToken(true); });
    $('gt-senha').addEventListener('submit', (ev) => { ev.preventDefault(); const s = $('gt-pw').value; if (s) abrir(s, montado); });
    $('gt-ver').addEventListener('click', (ev) => { const i = $('gt-pw'), ver = i.type === 'password'; i.type = ver ? 'text' : 'password'; ev.currentTarget.textContent = ver ? 'Ocultar' : 'Mostrar'; ev.currentTarget.setAttribute('aria-pressed', String(ver)); });
    $('gt-arquivo').addEventListener('click', () => $('gt-file').click());
    $('gt-file').addEventListener('change', async (ev) => { const f = ev.target.files[0]; ev.target.value = ''; if (!f) return; aviso('Lendo o arquivo…'); receber(await f.text()); });
    document.addEventListener('click', (ev) => { if (ev.target.closest('#web-sair')) window.BIN_WEB.sair(); });

    document.body.classList.add('gt-on');
    token = tokenGuardado();
    // Sessão lembrada: abre direto com os últimos dados guardados no aparelho e depois confere se há versão nova no Drive
    (async () => {
      const lemb = window.indexedDB && window.crypto && crypto.subtle ? await sessaoLembrada() : null;
      if (lemb) {
        conta = lemb.s.conta || ''; nomeConta = lemb.s.nome || conta; senhaSessao = lemb.senha;
        const g = await idb.get('dados');
        if (g && g.env) {
          aviso('Abrindo o painel…');
          let dados = null; try { dados = await destrancar(g.env, lemb.senha); } catch (e) { dados = null; }
          if (dados) {
            versaoBaixada = versaoCarregada = g.versao || null; lembrar(lemb.senha);
            montar(dados);
            if (PUBLICO || token) conferirNovidade(); else mostrarRenovar();
            return;
          }
        }
        if (token) { buscar(); return; }   // sem dados guardados: baixa e abre com a senha lembrada
        passo('entrar'); aviso('Toque em "Entrar com Google" para baixar os dados; a senha já está lembrada neste aparelho.');
        return;
      }
      if (token) buscar(); else passo('entrar');
    })();
  })();
</script>
</body>
</html>
