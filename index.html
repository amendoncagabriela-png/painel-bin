<script>
  /* Motor do painel na versão web: os dados chegam depois do login (arquivo trancado do Google Drive). */
  window.__montarDash = function (fonte) {
    function parseCsv(txt) {
      const rows = []; let row = [], cell = '', q = false;
      txt = String(txt || '').replace(/^﻿/, '');
      for (let i = 0; i < txt.length; i++) {
        const ch = txt[i];
        if (q) {
          if (ch === '"') { if (txt[i + 1] === '"') { cell += '"'; i++; } else q = false; }
          else cell += ch;
        } else if (ch === '"') q = true;
        else if (ch === ',') { row.push(cell); cell = ''; }
        else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
        else cell += ch;
      }
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      const head = rows.shift() || [];
      return rows.map((r) => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
    }
    let datasets = {}, cache = {}, bruto = {};
    const calcs = {}, ouvintes = [];
    function carregar(f) {
      datasets = {}; cache = {};
      for (const k of Object.keys(f)) if (k !== 'gerado_em' && !k.startsWith('json_')) datasets[k] = parseCsv(f[k]);
      bruto = f;
    }
    carregar(fonte);
    let params = {};
    const lerParams = () => { try { return JSON.parse(sessionStorage.getItem('bin_params') || '{}'); } catch (e) { return {}; } };
    params = Object.assign({ loja: 'Todas', mes: '' }, lerParams());
    function data(id) {
      if (cache[id]) return cache[id];
      let res;
      if (datasets[id]) res = { status: 'ok', data: datasets[id], columns: Object.keys(datasets[id][0] || {}) };
      else if (calcs[id]) {
        try {
          const ins = calcs[id].inputs.map((i) => { const d = data(i); if (d.status !== 'ok') throw new Error('Sem dados: ' + i); return d.data; });
          res = { status: 'ok', data: calcs[id].fn(...ins) };
        } catch (e) { console.error('Cálculo', id, e); res = { status: 'error', data: [], message: String(e) }; }
      } else res = { status: 'missing', data: [] };
      return (cache[id] = res);
    }
    function avisar() { for (const fn of ouvintes) { try { fn(); } catch (e) { console.error(e); } } }
    let t;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(avisar, 150); });
    window.dash = {
      data,
      calc: (id, def) => { calcs[id] = def; },
      onData: (fn) => { ouvintes.push(fn); fn(); },
      params: () => Object.assign({}, params),
      setParams: (p) => {
        // Cálculos que dependem de um filtro (def.params) são refeitos quando ele muda
        const refaz = Object.keys(p).some((k) => p[k] !== params[k] && Object.values(calcs).some((c) => (c.params || []).includes(k)));
        params = Object.assign({}, params, p); if (refaz) for (const k of Object.keys(cache)) if (calcs[k]) delete cache[k]; try { sessionStorage.setItem('bin_params', JSON.stringify(params)); } catch (e) {} avisar(); },
      resetParams: () => { params = { loja: "Todas", mes: "" }; for (const k of Object.keys(cache)) if (calcs[k]) delete cache[k]; avisar(); },
      setLink: (name) => { try { history.replaceState(null, '', '#' + name); } catch (e) { location.hash = name; } },
      refresh: () => {},
      colors: ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)', 'var(--c7)', 'var(--c8)'],
      geradoEm: fonte.gerado_em || '',
      bruto: (k) => bruto[k],
      __trocar: (f) => { carregar(f); window.dash.geradoEm = f.gerado_em || ''; avisar(); },
    };
  };
</script>

<style>
  /* Tela de entrada (celular primeiro): conta Google autorizada + senha do painel */
  .gt { position: fixed; inset: 0; z-index: 100; overflow-y: auto; background: #191919; color: #F4F1EA; display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); font-family: Arial, Helvetica, "Helvetica Neue", sans-serif; }
  body.gt-on { overflow: hidden; }
  .gt-card { width: 100%; max-width: 24rem; display: flex; flex-direction: column; gap: 1rem; }
  .gt-logo { width: 9.5rem; height: auto; display: block; }
  .gt-linha { height: 3px; width: 4.5rem; border-radius: 2px; background: linear-gradient(90deg, #AF6839, #FAF4B4); }
  .gt h1 { margin: 0; font-size: 1.6rem; line-height: 1.15; font-weight: 700; color: #fff; }
  .gt-sub { margin: -.6rem 0 0; color: #B9B2A6; font-size: .95rem; }
  .gt-passo { display: flex; flex-direction: column; gap: .75rem; margin: 0; }
  .gt-passo p { margin: 0; color: #DCD6CC; font-size: 1rem; line-height: 1.45; }
  .gt-passo p b { color: #fff; }
  .gt label { font-size: .9rem; color: #B9B2A6; margin-bottom: -.4rem; }
  .gt-btn { appearance: none; border: 0; border-radius: 10px; min-height: 52px; padding: .8rem 1rem; font: 700 1.05rem Arial, Helvetica, sans-serif; color: #fff; background: #A62A2E; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: .6rem; }
  .gt-btn:hover { background: #8f2327; }
  .gt-btn:focus-visible, .gt-link:focus-visible, .gt-pw input:focus-visible, .gt-pw button:focus-visible { outline: 3px solid #FAF4B4; outline-offset: 2px; }
  .gt-btn[disabled] { opacity: .6; cursor: progress; }
  .gt-btn svg { width: 20px; height: 20px; background: #fff; border-radius: 50%; padding: 2px; flex: none; }
  .gt-pw { display: flex; border: 1px solid #4a4640; border-radius: 10px; background: #232222; overflow: hidden; }
  .gt-pw input { flex: 1; min-width: 0; border: 0; background: transparent; color: #fff; font-size: 16px; padding: .85rem .9rem; min-height: 52px; }
  .gt-pw button { border: 0; background: transparent; color: #FAF4B4; font: 600 .9rem Arial, sans-serif; padding: 0 1rem; cursor: pointer; }
  .gt-msg { margin: 0; min-height: 1.4em; font-size: .95rem; line-height: 1.45; color: #DCD6CC; }
  .gt-msg.erro { color: #FF8F86; }
  .gt-barra { height: 6px; border-radius: 3px; background: #333; overflow: hidden; }
  .gt-barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #AF6839, #FAF4B4); transition: width .2s; }
  .gt-rodape { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; border-top: 1px solid #333; padding-top: .9rem; margin-top: .25rem; }
  .gt-link { appearance: none; border: 0; background: none; padding: .35rem 0; color: #FAF4B4; font: .92rem Arial, sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 44px; }
  .gt-nota { margin: 0; color: #8f897f; font-size: .8rem; line-height: 1.45; }
  #web-novo { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 90; max-width: min(92vw, 30rem); background: #191919; color: #FAF4B4; border: 1px solid #AF6839; border-radius: 10px; padding: .7rem 1rem; font: 600 .9rem Arial, sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .gt-lembrar { display: flex; align-items: center; gap: .5rem; margin: .7rem 0 .2rem; color: #d9d2c5; font: 600 .9rem Arial, sans-serif; cursor: pointer; }
  .gt-lembrar input { width: 1.15rem; height: 1.15rem; accent-color: #AF6839; }
  #web-renovar { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 89; display: flex; align-items: center; gap: .6rem; max-width: min(92vw, 26rem); background: #191919; color: #d9d2c5; border: 1px solid #AF6839; border-radius: 10px; padding: .5rem .6rem .5rem .9rem; font: 600 .82rem Arial, sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  #web-renovar button { border: 0; border-radius: 8px; background: #AF6839; color: #fff; font: 700 .85rem Arial, sans-serif; padding: .5rem .8rem; cursor: pointer; white-space: nowrap; }
  #web-renovar .x { background: transparent; color: #8f897f; padding: .3rem .4rem; }
  .web-sair { display: flex; justify-content: center; max-width: 78rem; margin: 1rem auto 0; }
  .web-sair button { appearance: none; border: 1px solid var(--color-border-line); background: var(--color-panel); color: var(--color-fg); border-radius: 8px; min-height: 44px; padding: .5rem 1.1rem; font: 600 .9rem Arial, sans-serif; cursor: pointer; }
</style>

<template id="tpl-painel">
<style>
  /* Identidade BIN: preto #191919 e vermelho #A62A2E na moldura, dourado #AF6839 → #FAF4B4 como destaque, Arial/Helvetica */
  .bd {
    --bin-black: #191919; --bin-red: #A62A2E; --bin-gold: #AF6839; --bin-gold-light: #FAF4B4; --bin-proj: #2E7DBF;
    --bin-font: Arial, Helvetica, "Helvetica Neue", sans-serif;
    --rail-fg: #F4F1EA; --rail-muted: #B9B2A6; --rail-ok: #6FD39A; --rail-warn: #F2C36B; --rail-bad: #FF8F86;
    display: flex; flex-direction: column; gap: var(--cds-gap-lg); font-family: var(--bin-font); max-width: 82rem; margin-inline: auto; color: var(--color-fg);
  }
  .bd * { font-family: var(--bin-font); box-sizing: border-box; }
  /* Moldura */
  .bd-top { background: var(--bin-black); color: #fff; border-radius: var(--cds-radius); overflow: hidden; }
  .bd-top-in { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-md) var(--cds-gap-xl); padding: var(--cds-pad-lg) var(--cds-pad-xl); }
  .bd-logo { height: 58px; width: auto; display: block; }
  .bd-brand { flex: 1 1 14rem; min-width: 0; }
  .bd-brand h1 { margin: 0; font-size: calc(var(--cds-font-size-title) * 1.05); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; color: #fff; }
  .bd-brand p { margin: .25rem 0 0; color: var(--bin-gold-light); font-size: var(--cds-font-size-body); opacity: .85; }
  .bd-upd { font-size: var(--cds-font-size-caption); color: #CFC8BC; text-align: right; line-height: 1.5; }
  .bd-upd b { color: #fff; font-size: var(--cds-font-size-body); }
  .bd-goldline { height: 4px; background: linear-gradient(90deg, var(--bin-gold), var(--bin-gold-light) 50%, var(--bin-gold)); }
  /* Abas: em cima no computador, barra fixa embaixo no celular */
  .bd-tabs { display: flex; gap: var(--cds-gap-xs); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; border-bottom: 1px solid var(--color-border-line); }
  .bd-tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: var(--cds-pad-sm) var(--cds-pad-md); font-size: var(--cds-font-size-body); color: var(--color-fg-muted); cursor: pointer; white-space: nowrap; margin-bottom: -1px; font-weight: 600; display: flex; align-items: center; gap: .4rem; }
  .bd-tab svg { width: 1.05rem; height: 1.05rem; }
  .bd-tab:hover { color: var(--color-fg); }
  .bd-tab[aria-selected="true"] { color: var(--color-fg); border-bottom-color: var(--bin-red); }
  .bd-tab .curto { display: none; }
  /* Botões "pai": Comercial e Financeiro */
  .bd-areas { display: flex; gap: var(--cds-gap-sm); margin-bottom: calc(-1 * var(--cds-gap-lg) + var(--cds-gap-sm)); }
  .bd-area { appearance: none; border: 1px solid var(--color-border-line); background: var(--color-panel); color: var(--color-fg-muted); border-radius: 999px; padding: .45rem 1.2rem; font: 700 var(--cds-font-size-body) var(--bin-font); letter-spacing: .02em; cursor: pointer; }
  .bd-area:hover { color: var(--color-fg); }
  .bd-area[aria-pressed="true"] { background: var(--bin-black); border-color: var(--bin-black); color: #fff; box-shadow: inset 0 -3px 0 var(--bin-gold); }
  .bd-area:focus-visible { outline: 2px solid var(--bin-gold); outline-offset: 2px; }
  .bd-tab:focus-visible, .bd-chip:focus-visible, .bd select:focus-visible, .bd tr.click:focus-visible { outline: 2px solid var(--bin-gold); outline-offset: 2px; }
  .bd-page { display: flex; flex-direction: column; gap: var(--cds-gap-lg); }
  /* Filtros */
  .bd-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-sm) var(--cds-gap-md); position: sticky; top: 0; z-index: 6; background: var(--color-bg); padding: var(--cds-pad-sm) 0; }
  .bd-f { display: flex; align-items: center; gap: var(--cds-gap-xs); min-width: 0; }
  .bd-f > span { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .bd .bd-ctl.bd-ctl-in { position: static; z-index: auto; background: none; box-shadow: none; margin: 0 0 var(--cds-gap-xs); padding: 0; flex-wrap: wrap; overflow: visible; }
  .bd-sobre { margin-top: var(--cds-gap-lg, 24px); }
  .bd { --status-h: 2.5rem; }
  .bd-status { position: sticky; top: 0; z-index: 22; min-height: var(--status-h); display: flex; align-items: center; justify-content: space-between; gap: var(--cds-gap-sm); padding: .3rem var(--cds-pad-md); margin-bottom: calc(-1 * var(--cds-gap-lg) + 4px); background: var(--bin-black); color: #ECE9E4; font-size: var(--cds-font-size-caption); border-radius: var(--cds-radius); box-shadow: 0 4px 10px rgba(0,0,0,.18); }
  .bd-status b { color: #fff; font-weight: 700; }
  .bd-status .st-lbl-c { display: none; }
  .bd-status .st-velho b { color: var(--rail-warn); }
  .bd-btn-atu { appearance: none; flex-shrink: 0; font: 700 .8rem var(--bin-font); padding: .35rem .8rem; border-radius: 999px; border: 1px solid var(--bin-gold); background: var(--bin-gold); color: #fff; cursor: pointer; }
  .bd-btn-atu[disabled] { opacity: .7; cursor: progress; }
  .bd-atu-pop { position: sticky; top: calc(var(--status-h) + 4px); z-index: 22; margin: 0 0 calc(-1 * var(--cds-gap-lg) + 4px); padding: var(--cds-pad-md); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); box-shadow: 0 8px 24px rgba(0,0,0,.18); font-size: var(--cds-font-size-body); line-height: 1.5; }
  .bd-atu-pop code { font-size: .85em; }
  .atu-barra { height: 12px; border-radius: 999px; background: var(--color-border-line); overflow: hidden; margin: .5rem 0 .35rem; }
  .atu-barra i { display: block; height: 100%; background: linear-gradient(90deg, var(--bin-gold), var(--bin-gold-light)); transition: width .6s ease; }
  .atu-linha { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
  .atu-linha b { color: var(--color-fg); }
  .bd-atu-pop .acoes { display: flex; gap: var(--cds-gap-sm); margin-top: var(--cds-gap-sm); flex-wrap: wrap; }
  .bd .bd-ctl { top: var(--status-h); }
  .bd-erp-nota { margin: 0; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); line-height: 1.5; }
  .bd-erp-nota .warn, .bd td.warn { color: var(--color-warn); }
  .bd-erp-nota a { text-decoration: underline; }
  .bd-upd-erp { color: inherit; font-size: .85em; text-decoration: underline; }
  .bd tr.curso td { font-style: italic; }
  .bd tr.grupo td { font-weight: 700; }
  .bd td.sub { padding-left: 1.6rem; color: var(--color-fg-muted); }
  .bd select option:disabled { color: var(--color-fg-muted); }

              <li><b>Despesas pessoais pagas pela empresa</b> (faturas de cartão, compras) hoje estão lançadas como pró-labore. Para a leitura correta, precisam de uma conta própria por sócio e entram como antecipação de lucros.</li>

            </ul>

        <div style="flex:1 1 16rem; min-width:0">

    </div>

    <div class="card">
      <h2>Loja a loja</h2>
      <p class="nota">Sugestão = mesmo mês do ano passado + crescimento recente, arredondada de 5 em 5 mil. Corrija nos campos da direita e aprove.</p>
      <div class="tabwrap">
        <table class="cartoes" id="tab-metas">
          <thead><tr>
            <th class="l">Loja</th><th>Mesmo mês ano ant.</th><th>Crescimento 3 m · ano</th><th>Projeção</th><th>Meta atual · atingiu</th><th>Sugestão loja · gerente</th><th>Meta loja</th><th>Meta gerente</th><th class="l">Enviar</th>

          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="nota legenda">Toque no selo de cada loja para ver a análise dela.<br><span class="selo acima">Aumento</span> A sugestão fica acima da meta do mês passado, puxada pelo crescimento recente da loja.<br><span class="selo igual">Igual</span> A projeção bate com a meta do mês passado.<br><span class="selo mantida">= mês passado</span> A projeção ficou abaixo da meta do mês passado, mas este mês não tem queda natural no histórico de faturamento. Como não reduzimos metas sem motivo, a sugestão repete a meta do mês passado, que a loja tem potencial de atingir.<br><span class="selo queda">Queda natural</span> Nos anos anteriores este mês vendeu menos que o mês passado na maioria das vezes, por isso a sugestão pode ficar um pouco abaixo.</p>
    </div>

    <details class="card" id="card-explica" open>
      <summary><span class="eyebrow">Texto da sugestão</span> · <span id="explica-titulo">Como a sugestão foi montada</span></summary>

      <div class="lista" id="explica-lojas" style="margin-top:12px"></div>

    <div class="card" id="card-aprovar">
      <h2>Aprovação da diretoria comercial</h2>
      <p class="nota" id="aprov-nota">Revise os valores, escreva uma observação se quiser e aprove. Depois de aprovar, cada loja ganha a arte e a mensagem para o gerente.</p>
      <label class="campo"><span class="rotulo">Observação da aprovação</span><textarea id="aprov-obs" placeholder="Ex.: metas de novembro consideram a Black Friday e o feriado de 20/11."></textarea></label>

        <span id="aprov-msg"></span>
      </div>
    </div>

    <div class="card" id="card-arte" hidden>
      <h2 id="arte-titulo">Arte para o gerente</h2>
      <p class="nota">A arte é salva como imagem para enviar no WhatsApp. A mensagem pode ser copiada ou aberta direto no WhatsApp.</p>
      <div class="arte-box">

          </div>
          <p id="arte-res" class="nota" style="margin-top:8px"></p>
        </div>
      </div>
    </div>

    <details class="card" id="card-parametros">
      <summary>Como a sugestão é calculada</summary>
      <div style="display:flex; flex-direction:column; gap:12px; margin-top:12px">
        <p class="nota" style="margin:0">Projeção = faturamento do mesmo mês do ano anterior × (1 + crescimento ponderado). O crescimento ponderado combina o crescimento dos últimos 3 meses fechados, o do acumulado do ano e o reajuste do salário mínimo, com os pesos abaixo. A meta do gerente mantém a distância média entre as duas metas de cada loja nos últimos 3 meses.</p>
        <div class="linha-ctl">
          <label class="campo"><span class="rotulo">Peso 3 meses</span><input type="text" class="num" id="p-w3" inputmode="decimal"></label>
          <label class="campo"><span class="rotulo">Peso ano</span><input type="text" class="num" id="p-wy" inputmode="decimal"></label>
          <label class="campo"><span class="rotulo">Peso salário mínimo</span><input type="text" class="num" id="p-ws" inputmode="decimal"></label>
          <label class="campo"><span class="rotulo">Arredondar para (R$)</span><input type="text" class="num" id="p-arr" inputmode="numeric"></label>
        </div>
        <div>
          <span class="rotulo">Salário mínimo por ano</span>
          <div class="tabwrap"><table id="tab-sm"><thead><tr><th class="l">Ano</th><th>Valor</th><th>Reajuste</th><th class="l">Origem</th></tr></thead><tbody></tbody></table></div>
        </div>
        <div class="linha-ctl">
          <label class="campo"><span class="rotulo">Ano</span><input type="text" class="num" id="sm-ano" inputmode="numeric" placeholder="2027"></label>
          <label class="campo"><span class="rotulo">Valor (R$)</span><input type="text" class="num" id="sm-valor" inputmode="decimal" placeholder="1741"></label>
          <label class="campo"><span class="rotulo">Origem</span><input type="text" id="sm-origem" placeholder="Decreto ou previsão"></label>
          <button class="btn" id="btn-sm" type="button">Salvar ano</button>
        </div>
        <div class="linha-ctl"><button class="btn pri" id="btn-param" type="button">Salvar pesos</button><span id="param-msg"></span></div>
      </div>
    </details>
  </section>

  /* ---------- Calendário ---------- */
  function pascoa(y) { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return `${y}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`; }

      { d: `${y}-01-01`, n: 'Confraternização universal', t: 'Feriado' }, { d: addDia(p, -47), n: 'Carnaval', t: 'Data comercial' }, { d: `${y}-02-02`, n: 'Volta às aulas (início de fevereiro)', t: 'Data comercial' },

      { d: `${y}-05-01`, n: 'Dia do Trabalho', t: 'Feriado' }, { d: nDow(y, 5, 0, 2), n: 'Dia das Mães', t: 'Data comercial' }, { d: `${y}-06-12`, n: 'Dia dos Namorados', t: 'Data comercial' },
      { d: `${y}-06-20`, n: 'Festas juninas (junho)', t: 'Data comercial' }, { d: nDow(y, 8, 0, 2), n: 'Dia dos Pais', t: 'Data comercial' }, { d: `${y}-09-07`, n: 'Independência', t: 'Feriado' },
      { d: `${y}-10-01`, n: `Mês de aniversário da BIN (${y - 2015} anos de marca)`, t: 'Data comercial', det: 'Outubro inteiro. Desde 2025 a BIN divulga o aniversário, faz campanhas promocionais e decora as lojas; antes de 2025 o mês não teve ação de aniversário. Prepare estoque e decoração com antecedência.' }, { d: `${y}-10-12`, n: 'Nossa Senhora Aparecida e Dia das Crianças', t: 'Feriado' }, { d: `${y}-11-02`, n: 'Finados', t: 'Feriado' }, { d: `${y}-11-15`, n: 'Proclamação da República', t: 'Feriado' },
      { d: `${y}-11-20`, n: 'Consciência Negra', t: 'Feriado' }, { d: bf, n: 'Black Friday', t: 'Data comercial' }, { d: `${y}-12-25`, n: 'Natal', t: 'Feriado' }, { d: `${y}-12-31`, n: 'Réveillon', t: 'Data comercial' },
      // Estaduais e municipais: lojas na capital (L2, L4, L5, L7/L10, L9) e em Guarulhos (L3, L6, L8)

      { d: addDia(p, 60), n: 'Corpus Christi', t: 'Feriado municipal (capital e Guarulhos)' },
      { d: `${y}-07-09`, n: 'Revolução Constitucionalista', t: 'Feriado estadual (SP)' },
      { d: `${y}-12-08`, n: 'Imaculada Conceição e aniversário de Guarulhos', t: 'Feriado municipal (Guarulhos: L3, L6, L8)' },

  }
  // Janela da antecipação: o mês atual inteiro e os 2 seguintes (anda sozinha na virada do mês)
  const janelaAnt = () => { const m0 = hoje.slice(0, 7), m2 = addMes(m0, 2); return { ini: m0 + '-01', fim: `${m2}-${String(diasMes(m2)).padStart(2, '0')}`, m0, m2 }; };
  const util = (s) => dt(s).getUTCDay() !== 0 && !feriados(Number(s.slice(0, 4))).includes(s);
  const diasMes = (m) => new Date(Date.UTC(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0)).getUTCDate();
  const wd = (m, a, b) => { let c = 0; for (let i = a; i <= b; i++) if (util(`${m}-${String(i).padStart(2, '0')}`)) c++; return c; };

  /* ---------- Estado ---------- */
  const S = { db: null, user: null, uid: null, podeEscrever: null, bases: {}, cfg: null, obs: [], metasMes: {}, nomes: {}, aba: 'metas', mes: null, edits: {}, filtroTipo: null, novo: { lojas: ['Todas'], tipos: [], efeito: 'fraca', origem: 'diretoria' }, arte: null };

  function parseCsv(txt) {
    const rows = []; let row = [], cell = '', q = false; txt = String(txt || '');
    for (let i = 0; i < txt.length; i++) { const ch = txt[i];
      if (q) { if (ch === '"') { if (txt[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true; else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
      else cell += ch; }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }

  }
  const cfg = () => {
    const c = S.cfg || {};
    return { w3: Number(c.w3 ?? PADRAO.w3), wy: Number(c.wy ?? PADRAO.wy), ws: Number(c.ws ?? PADRAO.ws), arred: Number(c.arred ?? PADRAO.arred), sm: Object.assign({}, PADRAO.sm, c.sm || {}) };
  };

  /* ---------- Dados derivados das bases ---------- */
  let cacheD = null;
  function dados() {
    const b = S.bases;
    if (cacheD && cacheD.src === b) return cacheD;
    const vendas = parseCsv(b.vendas?.csv), metas = parseCsv(b.metas?.csv), leit = parseCsv(b.leituras?.csv), diario = parseCsv(b.l2_diario?.csv);
    const V = new Map(); for (const r of vendas) V.set(r.mes + '|' + r.loja, Number(r.faturamento));
    const M = new Map(); for (const r of metas) M.set(r.mes + '|' + r.loja, { loja: Number(r.meta_loja), gerente: Number(r.meta_gerente) });

    const mesesM = [...new Set(metas.map((r) => r.mes))].sort();

  }

  /* ---------- Projeção e sugestão ---------- */
  // Outubro é o mês de aniversário da BIN. Campanha, divulgação e decoração das lojas só a partir de 2025.
  const ANIV_INICIO = 2015, ANIV_CAMPANHA = '2025-10';
  const campanhaBIN = (m) => m.slice(5) === '10' && m >= ANIV_CAMPANHA;
  // Meta do mês anterior: aprovada aqui, aprovada na planilha ou, se ainda não houver, a sugestão daquele mês.
  function metaAnterior(T, l) {
    const m = addMes(T, -1); const r = regMes(m);

    if (m > dados().ultMeta) { const s = sugerir(m); const x = s && s.rows.find((y) => y.loja === l); if (x) return { loja: x.sugLoja, gerente: x.sugGer, mes: m, fonte: 'sugestão' }; }
    return null;

  // Variação do mês anterior para o mês da meta nos anos anteriores. Queda natural = maioria dos anos em queda e média negativa.
  function sazonal(T, l) {
    const d = dados(); const mm = T.slice(5);
    const anos = [...new Set(d.mesesV.map((m) => m.slice(0, 4)))].filter((y) => y < T.slice(0, 4)).sort();
    const lst = [];
    for (const y of anos) {
      const b = `${y}-${mm}`, a = addMes(b, -1); const va = d.V.get(a + '|' + l), vb = d.V.get(b + '|' + l);

    return { lst, natural: val.length > 0 && quedas * 2 > val.length && media < 0, media, quedas, n: val.length };
  }
  function sugerir(T) {
    const d = dados(), c = cfg();
    if (!d.ultFechado) return null;
    const v = (m, l) => d.V.get(m + '|' + l) || 0;
    const fech = d.ultFechado < T ? d.ultFechado : addMes(T, -1);
    const ult3 = [0, 1, 2].map((i) => addMes(fech, -i));
    const ano = fech.slice(0, 4);
    const ytdM = d.mesesV.filter((m) => m.startsWith(ano) && m <= fech);

    const smAno = Number(T.slice(0, 4)), smA = c.sm[smAno], smB = c.sm[smAno - 1];
    const sm = smA && smB ? smA.valor / smB.valor - 1 : null;

    const rows = lojasMeta.map((l) => {
      const soma = (ms, off) => ms.reduce((s, m) => s + v(addMes(m, off), l), 0);
      const g3 = soma(ult3, -12) > 0 ? soma(ult3, 0) / soma(ult3, -12) - 1 : null;

      const g = wt > 0 ? parts.reduce((s, [x, w]) => s + x * w, 0) / wt : 0;
      const base = v(addMes(T, -12), l);
      let proj, baseTxt, med3 = null;
      if (base > 0) { proj = base * (1 + g); baseTxt = 'mesmo mês do ano anterior'; }
      else { med3 = soma(ult3, 0) / 3; proj = med3 * (1 + (sm || 0) / 4); baseTxt = 'média dos últimos 3 meses'; }
      const m3 = ult3.map((m) => d.M.get(m + '|' + l)).filter(Boolean);
      const at3 = m3.length ? ult3.filter((m) => d.M.get(m + '|' + l)).reduce((s, m) => s + v(m, l), 0) / m3.reduce((s, x) => s + x.loja, 0) : null;
      const metasRec = d.mesesM.slice(-3).map((m) => d.M.get(m + '|' + l)).filter(Boolean);
      const razao = metasRec.length ? metasRec.reduce((s, x) => s + x.gerente / x.loja, 0) / metasRec.length : 1.08;

      sg = Math.max(sg, sl + c.arred);
      // mês em andamento, pelas leituras
      const lt = (d.L.get(l) || []).filter((r) => r.mes === atual);
      const ul = lt[lt.length - 1];
      const projAtual = ul ? ul.acum / Math.max(1, wd(atual, 1, Number(ul.data.slice(8, 10)))) * wd(atual, 1, diasMes(atual)) : null;
      const e3 = (off) => ult3.reduce((s, m) => { const x = d.E.get(addMes(m, off) + '|' + l); return x ? { p: s.p + x.ped, v: s.v + x.val, i: s.i + x.ident, n: s.n + 1 } : s; }, { p: 0, v: 0, i: 0, n: 0 });

    });

  /* ---------- Bases e documentos ---------- */
  // Registro do mês: o documento aprovado aqui ou, sem ele, as metas já aprovadas nas planilhas (vigentes).
  const planilhaDe = (m) => m < '2026' ? 'Meta_2025' : 'Metas_' + m.slice(0, 4) + '.xlsx';
  function regMes(m = S.mes) {

    const d = dados(); const lojas = {};
    for (const l of ORDEM) { const x = d.M.get(m + '|' + l); if (x) lojas[l] = { loja: x.loja, gerente: x.gerente }; }

    const prompt = `Você apoia a diretoria comercial do Grupo BIN Embalagens (lojas de embalagens descartáveis e festas em São Paulo). Hoje é ${hoje}.\n\nObservações registradas pela diretoria, com o resultado medido pelo sistema (vendas diárias de todas as lojas pelo ERP; "ritmo" vem das leituras de faturamento acumulado contra a meta):\n${obs.join('\n') || '(nenhuma ainda)'}\n\nDatas do calendário nos próximos 60 dias: ${evs.join('; ') || 'nenhuma'}.\n${r && r.status === 'aprovada' ? `Metas aprovadas para ${S.mes}: ${Object.entries(r.lojas).map(([l, v]) => `${l} loja ${v.loja} gerente ${v.gerente}`).join('; ')}.` : ''}\n\nEscreva em português, em texto simples (sem tabelas, sem markdown pesado), no máximo 250 palavras:\n1. Padrões que as observações mostram (por tipo de evento e época do ano), citando os números medidos. Se houver poucos registros, diga isso.\n2. O que esperar nas próximas semanas, com base no calendário e nos registros de anos anteriores.\n3. Até 4 ações de preparo concretas para as lojas (estoque, compras, promoções, ajuste de meta), sem falar de pessoas pelo nome.\nNão invente números que não estão acima.`;

  function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  /* ---------- Abas e render ---------- */
  function mostrar(id, push) {
    if (!['metas', 'observacoes', 'antecipacao'].includes(id)) id = 'metas';
    S.aba = id;
    document.querySelectorAll('.aba').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.aba === id)));
    document.querySelectorAll('section[data-pag]').forEach((s) => { s.hidden = s.dataset.pag !== id; });

  }
  document.querySelectorAll('.aba').forEach((b) => b.addEventListener('click', () => mostrar(b.dataset.aba, true)));

    const ids = [...new Set([...S.obs.map((o) => o.autor), ...Object.values(S.metasMes).flatMap((m) => [m.aprovado_por, ...(m.historico || []).map((h) => h.aprovado_por)])].filter(Boolean))];

    const ps = await S.user.profiles(ids); let mudou = false;

    if (!db) { av.hidden = false; av.className = 'aviso ruim'; av.textContent = 'Não foi possível ligar a Central aos dados do painel. Recarregue a página.'; $('#quem').textContent = 'Sem conexão com os dados'; render(); return; }
    if (user) {
      const me = await user.me(); S.uid = me.id;

      $('#quem').replaceChildren(document.createTextNode('Conectado como '), el('b', null, me.name || 'você'));

    } else $('#quem').textContent = 'Conectado';
    const erro = () => { av.hidden = false; av.className = 'aviso ruim'; av.textContent = 'A conexão com os dados caiu. Recarregue a página.'; };
    db.collection('bases').onSnapshot((s) => { const b = {}; for (const d of s.docs) b[d.id] = d.data(); S.bases = b; render(); }, erro);
    db.collection('config').doc('geral').onSnapshot((s) => { S.cfg = s.exists ? s.data() : null; render(); }, erro);

    db.collection('metas_mes').onSnapshot((s) => { const m = {}; for (const d of s.docs) m[d.id] = d.data(); S.metasMes = m; render(); resolverNomes(); }, erro);

  <details class="bd-card bd-sobre" id="sobre">
    <summary>Sobre os dados e a atualização <span class="per">| fontes e como ler</span></summary>
      <ul class="bd-notes">
        <li>Fontes: "VENDAS - EVOLUÇÃO" (faturamento mensal por loja), "Metas_2025" (metas de set a dez/2025), "Metas_2026" (metas, markup e leituras até out/2026, quando foi descontinuada), as metas aprovadas na Central Comercial e os relatórios do ERP Futura (vendas, lucratividade, formas de pagamento, produtos e contas pagas). Pedidos para o cliente USO LOJA (CONSUMO) não contam como venda em nenhuma análise. Hoje o ERP chega só da L2; as abas Raio-X, Produtos e Gastos já têm a caixa de loja e passam a mostrar as outras unidades quando os relatórios delas forem extraídos.</li>
        <li>Mês atual: o realizado é o acumulado do mês no relatório de vendas do ERP (01), dia a dia, e o markup, venda ÷ custo no relatório de lucratividade (03); a meta é a aprovada na Central Comercial (ou a do histórico). Em "Ler até" dá para escolher o dia da leitura, inclusive no meio de uma semana ainda não fechada: semana, quinzena, ritmo e projeção passam a valer até esse dia. O esperado de cada dia distribui a meta pelos dias de loja aberta: segunda a sábado, sem os feriados nacionais.</li>
        <li>Ritmo = realizado ÷ esperado na data da leitura. No ritmo: 100% ou mais. Atenção: de 95% a 99%. Abaixo: menos de 95%.</li>
        <li>Raio-X: vem dos pedidos do ERP. O total por mês fica a menos de 1% da "VENDAS - EVOLUÇÃO" na maioria dos meses; em mar/2024 o ERP soma 8,6% a mais que a planilha. Cliente identificado é o pedido com cadastro; o código 133 (VAREJO) é a venda sem cadastro. Nomes de clientes, vendedores e operadores de caixa não entram no painel.</li>
        <li>Gastos: são as contas pagas do ERP (relatório 05, por fornecedor), de todas as lojas. Como o ERP lança as despesas como "fornecedores" (ex.: "DESPESA COM ALUGUEL"), cada conta vai para um grupo e um subgrupo: Mercadorias para revenda (inclui produtos de limpeza), Pessoal, Impostos, Estrutura das lojas, Investimentos (bens), Logística e veículos, Administrativo, Comercial e marketing, Financeiro e Outras. Despesas operacionais = tudo, menos compras de mercadoria, investimentos e pagamento de empréstimos. Pessoal entra só em totais, sem nomes, pelo CNPJ que pagou: ainda não há rateio pela loja onde cada pessoa trabalha. Retiradas dos sócios entram por enquanto como salário, em Pessoal (no total pago e nas despesas operacionais), até a criação da conta de lucros no ERP; o quadro dos sócios mostra a abertura: pró-labore (remuneração), antecipação de lucros (por sócio, quando a conta do ERP diz o nome) e despesas pessoais pagas pela empresa (faturas de cartão e compras lançadas como pró-labore). Gasto sobre o faturamento usa as vendas do ERP da mesma loja.</li>
        <li>Transferências entre lojas (relatório 12): o relatório é do lado de quem recebe e não traz a loja de origem, então mostra o total recebido por loja, mas não o saldo enviado menos recebido. Estoque do fim do mês (relatório 10): em teste, com janeiro/2024 de algumas lojas; entra no painel quando houver todos os meses.</li>
        <li>Produtos: o relatório de produtos do ERP vem por trimestre (2024 e 2025) ou semestre (2026); a comparação é com o mesmo período do ano anterior. Família = primeira palavra da descrição. Margem = lucro bruto ÷ venda, pelo custo cadastrado no ERP.</li>
        <li>Metas: a meta do gerente de 2025 existe só de setembro a dezembro (Metas_2025), então a comparação com o ano anterior vale para esses meses. O mês em andamento usa a projeção pelo ritmo da última leitura.</li>
        <li>Atualização: o quadro "Atualização dos relatórios" mostra, por relatório e loja, até que dia vão os dados e quando o arquivo foi salvo. O 01 (resumo de pedidos) no layout "Vendas resumido" por dia (com Dt. Emissão) tem data e entra mês a mês no Raio-X de todas as lojas; no layout antigo, sem data, só é lido na L2, datado pelo 06. A forma de pagamento só aparece onde há o 06 (hoje, a L2). Meses em que o ERP traz menos da metade do faturamento da planilha ficam fora da análise e aparecem no aviso. O 02 (produtos) não tem data por linha: o período vem do nome do arquivo. Contas pagas no layout sem plano de contas não entram em Gastos, porque não dá para separar grupos nem tirar as despesas de pessoal. O mês corrente aparece sempre como "em curso".</li>
        <li>Headline, evidências, onde agir e ressalva são escritas automaticamente a partir dos números. A decisão continua com a diretoria.</li>
        <li>L3 (Pimentas) inclui as vendas de rua e, até dezembro de 2025, as operações da M N (L1). A partir de janeiro de 2026, as operações da M N ficam com a L8 (Taboão, código interno 108304). L7 e L10 (São Miguel) aparecem juntas.</li>
        <li>A L6 (C. Guarulhos) está sem operação desde março de 2026. Em 2024, a L3 tem o mesmo valor redondo de janeiro a maio, o que sugere estimativa.</li>
        <li>Para 2025 valem só "VENDAS - EVOLUÇÃO" e "Metas_2025". Informações de funcionários não são usadas.</li>
      </ul>

<script>
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const MESES_LONGOS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  /* ---------- Acompanhamento do mês ---------- */
  dash.calc('acomp_base', {
    inputs: ['metas26', 'erp_diario', 'erp_cmv_diario'],
    params: ['mes_ate'],
    title: 'Leituras com meta',
    description: 'Uma leitura por dia com venda: o acumulado do mês por loja no relatório de vendas do ERP (01), sem os pedidos de uso da loja, com o markup acumulado do relatório de lucratividade (03) e a meta do mês (aprovada na Central Comercial ou a do histórico). "Todas" soma as lojas até o último dia lido de todas. "Ler até" corta o mês escolhido num dia, para ler uma semana ainda não fechada.',
    fn: (metas26, erp_diario, erp_cmv_diario) => {
      const NOMES = { L2: 'Guaianases', L3: 'Pimentas', L4: 'São Mateus', L5: 'Itaim', L6: 'C. Guarulhos', 'L7/L10': 'São Miguel', L8: 'Taboão', L9: 'Tiradentes' };
      // Metas: as aprovadas na Central Comercial valem sobre as do histórico (antiga planilha Metas_2026)
      const meta = new Map(metas26.map((m) => [m.mes + '|' + m.loja, { loja: Number(m.meta_loja), gerente: Number(m.meta_gerente), markup: m.markup === '' ? null : Number(m.markup) }]));
      try {
        const c = JSON.parse((dash.bruto && dash.bruto('json_central')) || '{}');
        for (const [mes, d] of Object.entries(c.metas_mes || {})) if (d && d.status === 'aprovada') for (const [loja, v] of Object.entries(d.lojas || {}))
          if (v && v.loja > 0) meta.set(mes + '|' + loja, { ...(meta.get(mes + '|' + loja) || {}), loja: Number(v.loja), gerente: Number(v.gerente) || Number(v.loja) });
      } catch (e) { /* sem cópia da Central: fica o histórico */ }
      // Corte "Ler até" (só no mês dele)
      const ate = (dash.params().mes_ate || '');
      const corta = (mes, d) => ate && ate.slice(0, 7) === mes && d > Number(ate.slice(8, 10));
      const porDia = (rows, f) => { const m = new Map(); for (const r of rows) { const k = r.data.slice(0, 7) + '|' + r.loja, d = Number(r.data.slice(8, 10)); if (corta(k.slice(0, 7), d)) continue;
        if (!m.has(k)) m.set(k, new Map()); const dm = m.get(k), o = dm.get(d) || {}; f(o, r); dm.set(d, o); } return m; };
      const vendas = porDia(erp_diario, (o, r) => { o.v = (o.v || 0) + Number(r.valor); });
      const lucr = porDia(erp_cmv_diario, (o, r) => { o.c = (o.c || 0) + Number(r.custo); o.v = (o.v || 0) + Number(r.venda); });
      const out = [];
      for (const [k, dias] of vendas) {
        const [mes, loja] = k.split('|'); const m = meta.get(k); if (!m || !(m.loja > 0)) continue;
        const ds = [...dias.keys()].sort((a, c) => a - c); if (!ds.length || ds[0] > 3) continue;   // o ERP precisa ter o mês desde o começo
        const lm = lucr.get(k), dl = lm ? [...lm.keys()].sort((a, c) => a - c) : [];
        let tot = 0, cc = 0, cv = 0, j = 0;
        for (const d of ds) {
          tot += dias.get(d).v;
          while (j < dl.length && dl[j] <= d) { cc += lm.get(dl[j]).c; cv += lm.get(dl[j]).v; j++; }
          // markup acumulado do 03 até o dia; sem 03 no mês, o markup do histórico
          const mk = cc > 0 ? cv / cc - 1 : (dl.length ? null : m.markup ?? null);
          out.push({ mes, loja, nome: NOMES[loja] || loja, dia: d, realizado: tot, markup: mk, venda03: cv, custo03: cc, meta_loja: m.loja, meta_gerente: m.gerente || m.loja, fonte: 'erp' });
        }
      }
      // "Todas": soma das lojas até o último dia em que todas têm leitura (o acumulado de cada loja segue igual nos dias sem venda)
      for (const mes of [...new Set(out.map((r) => r.mes))]) {
        const rs = out.filter((r) => r.mes === mes);
        const lojas = [...new Set(rs.map((r) => r.loja))];
        const por = new Map(lojas.map((l) => [l, rs.filter((r) => r.loja === l)]));
        const fim = Math.min(...lojas.map((l) => por.get(l)[por.get(l).length - 1].dia));
        const ml = lojas.reduce((s, l) => s + por.get(l)[0].meta_loja, 0), mg = lojas.reduce((s, l) => s + por.get(l)[0].meta_gerente, 0);
        for (const dia of [...new Set(rs.map((r) => r.dia))].filter((d) => d <= fim).sort((a, c) => a - c)) {
          let tot = 0, cc = 0, cv = 0, mkH = 0, comMk = 0;
          for (const l of lojas) { const q = por.get(l).filter((r) => r.dia <= dia).pop(); if (!q) continue;
            tot += q.realizado; cc += q.custo03; cv += q.venda03; if (q.markup != null) { mkH += q.markup * q.realizado; comMk++; } }
          const mk = cc > 0 ? cv / cc - 1 : comMk === lojas.length && tot > 0 ? mkH / tot : null;
          out.push({ mes, loja: 'Todas', nome: 'Todas as lojas', dia, realizado: tot, markup: mk, venda03: cv, custo03: cc, meta_loja: ml, meta_gerente: mg, fonte: 'erp' });
        }
      }
      return out.sort((a, b) => a.mes.localeCompare(b.mes) || a.loja.localeCompare(b.loja) || a.dia - b.dia);
    },
  });

  dash.calc('acomp_periodos', {
    inputs: ['acomp_base'],
    title: 'Semanas, quinzenas e mês',
    description: 'Realizado em cada período (diferença entre o acumulado no fim e no começo dele; a semana em andamento vai até o último dia lido ou o "Ler até") contra a meta da loja distribuída pelos dias de loja aberta (seg a sáb, sem feriados nacionais).',
    fn: (acomp_base) => {
      const FER = ['01-01', '04-03', '04-21', '05-01', '09-07', '10-12', '11-02', '11-15', '11-20', '12-25'];
      const dia = (mes, n) => mes + '-' + String(n).padStart(2, '0');
      const dow = (s) => new Date(s + 'T12:00:00Z').getUTCDay();
      const util = (s) => dow(s) !== 0 && !FER.includes(s.slice(5));
      const wd = (mes, a, b) => { let c = 0; for (let i = a; i <= b; i++) if (util(dia(mes, i))) c++; return c; };
      const groups = new Map();
      for (const r of acomp_base) { const k = r.mes + '|' + r.loja; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
      const out = [];
      for (const arr of groups.values()) {
        const { mes, loja, nome, meta_loja: ml, meta_gerente: mg } = arr[0];
        const N = new Date(Date.UTC(Number(mes.slice(0, 4)), Number(mes.slice(5, 7)), 0)).getUTCDate();
        const DM = wd(mes, 1, N);
        const last = arr[arr.length - 1].dia;
        const cum = (d) => { let v = 0, dd = 0; for (const p of arr) if (p.dia <= d) { v = p.realizado; dd = p.dia; } return { v, d: dd }; };
        const per = [];
        for (let s = 1; s <= N;) { const e = Math.min(N, s + (7 - dow(dia(mes, s))) % 7); per.push({ tipo: 'semana', ini: s, fim: e }); s = e + 1; }
        per.push({ tipo: 'quinzena', ini: 1, fim: 15 }, { tipo: 'quinzena', ini: 16, fim: N }, { tipo: 'mes', ini: 1, fim: N });
        for (const p of per) {
          const f = cum(p.fim);
          if (f.d < p.ini) continue;
          const b = cum(p.ini - 1);
          const ef = Math.max(p.ini, b.d + 1);
          const dt = wd(mes, ef, p.fim) || 1;
          const metaP = ml * dt / DM;
          const esp = ml * wd(mes, ef, f.d) / DM;
          const real = f.v - b.v;
          out.push({ mes, loja, nome, id: p.tipo + '-' + p.ini, tipo: p.tipo, inicio: dia(mes, ef), fim: dia(mes, p.fim), ate: dia(mes, f.d),
            realizado: real, meta_loja: metaP, meta_gerente: mg * dt / DM, esperado: esp, pct: real / metaP, ritmo: esp > 0 ? real / esp : null,
            atual: p.ini <= last && last <= p.fim, completo: wd(mes, f.d + 1, p.fim) === 0 });
        }
      }
      return out;
    },
  });

  dash.calc('acomp', {
    inputs: ['acomp_base', 'acomp_periodos'],
    title: 'Situação do mês por loja',
    description: 'Na última leitura de cada mês: realizado, ritmo contra o esperado, projeção pelo ritmo atual, quanto falta vender por dia e o ritmo necessário para a meta do gerente.',
    fn: (acomp_base, acomp_periodos) => {
      const FER = ['01-01', '04-03', '04-21', '05-01', '09-07', '10-12', '11-02', '11-15', '11-20', '12-25'];
      const dia = (mes, n) => mes + '-' + String(n).padStart(2, '0');
      const util = (s) => new Date(s + 'T12:00:00Z').getUTCDay() !== 0 && !FER.includes(s.slice(5));
      const wd = (mes, a, b) => { let c = 0; for (let i = a; i <= b; i++) if (util(dia(mes, i))) c++; return c; };
      const ultimo = new Map(), qtd = new Map();
      for (const r of acomp_base) { const k = r.mes + '|' + r.loja; ultimo.set(k, r); qtd.set(k, (qtd.get(k) || 0) + 1); }
      const rows = [...ultimo.values()].map((r) => {
        const N = new Date(Date.UTC(Number(r.mes.slice(0, 4)), Number(r.mes.slice(5, 7)), 0)).getUTCDate();
        const dm = wd(r.mes, 1, N), da = wd(r.mes, 1, r.dia), dr = dm - da;
        const esp = r.meta_loja * da / dm;
        const ritmo = esp > 0 ? r.realizado / esp : null;
        const taxa = da > 0 ? r.realizado / da : 0;
        const proj = da > 0 ? taxa * dm : null;
        const sem = acomp_periodos.find((p) => p.mes === r.mes && p.loja === r.loja && p.tipo === 'semana' && p.atual);
        return {
          mes: r.mes, loja: r.loja, nome: r.nome, data: dia(r.mes, r.dia), fonte: r.fonte || "planilha", leituras: qtd.get(r.mes + '|' + r.loja),
          realizado: r.realizado, meta_loja: r.meta_loja, meta_gerente: r.meta_gerente,
          pct_loja: r.realizado / r.meta_loja, pct_gerente: r.realizado / r.meta_gerente,
          dias_mes: dm, dias_ate: da, dias_rest: dr, esperado: esp, ritmo,
          projecao: proj, proj_pct: proj / r.meta_loja, proj_pct_gerente: proj / r.meta_gerente,
          falta_dia_loja: dr > 0 ? Math.max(0, r.meta_loja - r.realizado) / dr : 0,
          falta_dia_gerente: dr > 0 ? Math.max(0, r.meta_gerente - r.realizado) / dr : 0,
          ritmo_nec_gerente: dr > 0 && taxa > 0 ? Math.max(0, r.meta_gerente - r.realizado) / dr / taxa : null,
          semana_ritmo: sem ? sem.ritmo : null, markup: r.markup,
          status: ritmo == null ? '' : ritmo >= 1 ? 'No ritmo' : ritmo >= 0.95 ? 'Atenção' : 'Abaixo',
        };
      });
      for (const t of rows.filter((r) => r.loja === 'Todas')) {
        const ls = rows.filter((r) => r.mes === t.mes && r.loja !== 'Todas');
        t.n_lojas = ls.length;
        t.n_ritmo = ls.filter((r) => r.ritmo >= 1).length;
      }
      return rows;
    },
  });

  dash.calc('acomp_curva', {
    inputs: ['acomp_base'],
    title: 'Curva do mês',
    description: 'Para cada dia do mês: acumulado esperado pela meta da loja e do gerente, leitura do dia (quando houve) e projeção pelo ritmo da última leitura.',
    fn: (acomp_base) => {
      const FER = ['01-01', '04-03', '04-21', '05-01', '09-07', '10-12', '11-02', '11-15', '11-20', '12-25'];
      const dia = (mes, n) => mes + '-' + String(n).padStart(2, '0');
      const util = (s) => new Date(s + 'T12:00:00Z').getUTCDay() !== 0 && !FER.includes(s.slice(5));
      const groups = new Map();
      for (const r of acomp_base) { const k = r.mes + '|' + r.loja; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
      const out = [];
      for (const arr of groups.values()) {
        const { mes, loja, meta_loja: ml, meta_gerente: mg } = arr[0];
        const N = new Date(Date.UTC(Number(mes.slice(0, 4)), Number(mes.slice(5, 7)), 0)).getUTCDate();
        const ac = [0]; for (let i = 1; i <= N; i++) ac[i] = ac[i - 1] + (util(dia(mes, i)) ? 1 : 0);
        const lt = arr[arr.length - 1];
        const taxa = ac[lt.dia] > 0 ? lt.realizado / ac[lt.dia] : 0;
        for (let d = 1; d <= N; d++) {
          const r = arr.find((p) => p.dia === d);
          out.push({ mes, loja, dia: d, esperado_loja: ml * ac[d] / ac[N], esperado_gerente: mg * ac[d] / ac[N],
            realizado: r ? r.realizado : null, projecao: d >= lt.dia ? lt.realizado + taxa * (ac[d] - ac[lt.dia]) : null });
        }
      }
      return out;
    },
  });

  dash.calc('cenarios', {
    inputs: ['acomp'],
    title: 'Cenários de fechamento',
    description: 'Fechamento do mês se o ritmo diário dos dias restantes for 10% menor, igual ou 10% maior que o ritmo médio até a última leitura.',
    fn: (acomp) => {
      const C = [{ id: 'baixo', f: 0.9 }, { id: 'base', f: 1 }, { id: 'alto', f: 1.1 }];
      const out = [];
      for (const r of acomp) {
        const taxa = r.dias_ate > 0 ? r.realizado / r.dias_ate : 0;
        for (const c of C) {
          const fech = r.realizado + taxa * c.f * r.dias_rest;
          out.push({ mes: r.mes, loja: r.loja, id: c.id, fator: c.f, fechamento: fech, pct_loja: fech / r.meta_loja, pct_gerente: fech / r.meta_gerente });
        }
      }
      return out;
    },
  });

  dash.calc('historia_mes', {
    inputs: ['acomp'],
    title: 'Mensagem do mês',
    description: 'Headline, evidências, onde agir e ressalva de cada mês e loja, escritas a partir dos números da última leitura.',
    fn: (acomp) => {
      const MES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
      const pc = (v) => Math.round(v * 100) + '%';
      const rs = (v) => v >= 1e6 ? 'R$ ' + (v / 1e6).toFixed(2).replace('.', ',') + ' mi' : 'R$ ' + Math.round(v / 1e3).toLocaleString('pt-BR') + ' mil';
      const dm = (s) => s.slice(8, 10) + '/' + s.slice(5, 7);
      return acomp.map((r) => {
        const mn = MES[Number(r.mes.slice(5, 7)) - 1];
        const Mes = mn[0].toUpperCase() + mn.slice(1);
        const outras = acomp.filter((q) => q.mes === r.mes && q.loja !== 'Todas');
        const abaixo = outras.filter((q) => q.ritmo < 1).sort((a, b) => a.ritmo - b.ritmo);
        const ordem = outras.slice().sort((a, b) => b.ritmo - a.ritmo);
        const melhor = ordem[0];
        const fechado = r.dias_rest === 0;
        const ok = r.ritmo >= 1;
        const todas = r.loja === 'Todas';
        const quem = todas ? 'o grupo' : r.loja + ' ' + r.nome;
        const Quem = todas ? 'O grupo' : r.loja + ' ' + r.nome;
        const headline = fechado
          ? `${Mes} fechado em ${rs(r.realizado)}: ${pc(r.pct_loja)} da meta da loja e ${pc(r.pct_gerente)} da meta do gerente.`
          : `${Mes} ${ok ? 'no ritmo' : 'abaixo do ritmo'}: ${quem} está em ${pc(r.ritmo)} do esperado e caminha para ${pc(r.proj_pct)} da meta da loja.`;
        const complemento = todas
          ? (abaixo.length === 0 ? `Todas as ${outras.length} lojas estão ${fechado ? 'acima da meta da loja' : 'no ritmo da meta'}.`
            : abaixo.length === 1 ? `${abaixo[0].loja} ${abaixo[0].nome} é a única loja ${fechado ? 'abaixo da meta' : 'abaixo do ritmo'} (${pc(abaixo[0].ritmo)}).`
            : `${abaixo.length} lojas ${fechado ? 'abaixo da meta' : 'abaixo do ritmo'}: ${abaixo.map((q) => q.loja + ' ' + q.nome).join(', ')}.`)
          : `${ordem.indexOf(outras.find((q) => q.loja === r.loja)) + 1}ª posição em ritmo entre as ${outras.length} lojas.`;
        const evid1 = `Realizado de ${rs(r.realizado)} até ${dm(r.data)}, ${pc(r.pct_loja)} da meta do mês, com ${r.dias_ate} de ${r.dias_mes} dias de loja aberta.`;
        const evid2 = todas
          ? `${r.n_ritmo} de ${r.n_lojas} lojas no ritmo; a melhor é ${melhor.loja} ${melhor.nome}, com ${pc(melhor.ritmo)}.`
          : (r.semana_ritmo != null ? `Na semana atual, ${pc(r.semana_ritmo)} do esperado para o período.` : `Meta da loja de ${rs(r.meta_loja)} no mês.`);
        const evid3 = fechado
          ? `Meta do gerente: ${pc(r.pct_gerente)} atingida.`
          : `Projeção de ${rs(r.projecao)}: ${pc(r.proj_pct)} da meta da loja e ${pc(r.proj_pct_gerente)} da do gerente.`;
        let onde;
        if (fechado) onde = 'Mês encerrado. Use o resultado para calibrar a meta do próximo mês.';
        else if (todas && abaixo.length) onde = `${abaixo[0].loja} ${abaixo[0].nome} precisa vender ${rs(abaixo[0].falta_dia_loja)} por dia nos ${abaixo[0].dias_rest} dias restantes para bater a meta da loja.`;
        else if (!todas && !ok) onde = `Precisa vender ${rs(r.falta_dia_loja)} por dia nos ${r.dias_rest} dias restantes para bater a meta da loja.`;
        else if (r.proj_pct_gerente < 1) onde = `${Quem} precisa de ${rs(r.falta_dia_gerente)} por dia nos ${r.dias_rest} dias restantes para chegar à meta do gerente.`;
        else onde = `${todas ? 'Lojas no ritmo e projeção' : 'Projeção'} acima da meta do gerente. Foco em manter o ritmo até o fim do mês.`;
        const ressalva = fechado
          ? 'Valores do relatório de vendas do ERP (01), sem o uso da loja. O fechamento oficial está na planilha de vendas.'
          : `A projeção supõe que o ritmo dos ${r.leituras} dias de venda lidos se mantém. Com ${r.dias_rest} dias pela frente, feriados e campanhas podem mudar o fechamento.`;
        const d = Math.round((r.ritmo - 1) * 100);
        const titulo_curva = fechado ? `${Mes} fechou em ${pc(r.pct_loja)} da meta da loja`
          : d === 0 ? 'Acumulado na linha da meta da loja'
          : `Acumulado ${Math.abs(d)}% ${d > 0 ? 'acima' : 'abaixo'} da linha da meta da loja`;
        const titulo_lojas = abaixo.length === 0 ? 'Todas as lojas acima do ritmo da meta'
          : `${abaixo.map((q) => q.loja).join(', ')} abaixo do ritmo; as demais acima`;
        return { mes: r.mes, loja: r.loja, headline, complemento, evid1, evid2, evid3, onde_agir: onde, ressalva, titulo_curva, titulo_lojas };
      });
    },
  });

  /* ---------- Ano e lojas: um resultado para cada ano, mês de referência e loja ---------- */
  dash.calc('kpis', {
    inputs: ['vendas'],
    title: 'Indicadores do ano',
    description: 'Para cada ano, mês de referência e loja (ou todas): acumulado de janeiro até o mês, comparado ao mesmo período do ano anterior, o mês isolado e o ano fechado anterior.',
    fn: (vendas) => {
      const S = new Map();
      const add = (k, v) => S.set(k, (S.get(k) || 0) + v);
      const lojasSet = new Set(), meses = new Map();
      for (const d of vendas) {
        const a = Number(d.ano), m = Number(d.mes_num), v = Number(d.faturamento);
        add(`${a}|${m}|${d.loja}`, v); add(`${a}|${m}|Todas`, v); lojasSet.add(d.loja);
        meses.set(a, Math.max(meses.get(a) || 0, m));
      }
      const lojas = [...lojasSet];
      const g = (a, m, l) => S.get(`${a}|${m}|${l}`) || 0;
      const ytd = (a, m, l) => { let s = 0; for (let i = 1; i <= m; i++) s += g(a, i, l); return s; };
      const vr = (x, y) => y > 0 ? x / y - 1 : null;
      const out = [];
      for (const [a, mMax] of meses) {
        for (let m = 1; m <= mMax; m++) {
          const ativas = lojas.filter((l) => g(a, m, l) > 0);
          const antes = lojas.filter((l) => ytd(a - 1, m, l) > 0);
          const comp = ativas.filter((l) => ytd(a - 1, m, l) > 0);
          const totGrupo = ytd(a, m, 'Todas');
          for (const l of ['Todas', ...lojas]) {
            const at = ytd(a, m, l); if (at <= 0) continue;
            const an = ytd(a - 1, m, l);
            const todas = l === 'Todas';
            const mesmas = todas ? vr(comp.reduce((s, x) => s + ytd(a, m, x), 0), comp.reduce((s, x) => s + ytd(a - 1, m, x), 0)) : vr(at, an);
            out.push({
              ano: a, mes: m, loja: l, ytd_atual: at, ytd_anterior: an, ytd_var: vr(at, an), mesmas_lojas_var: mesmas,
              lojas_fora: todas ? (antes.filter((x) => !ativas.includes(x)).join(', ') || 'nenhuma') : 'nenhuma',
              mes_atual: g(a, m, l), mes_anterior: g(a - 1, m, l), mes_var: vr(g(a, m, l), g(a - 1, m, l)),
              ano_fechado: a - 1, total_fechado: ytd(a - 1, 12, l), total_var: vr(ytd(a - 1, 12, l), ytd(a - 2, 12, l)),
              lojas_ativas: todas ? ativas.length : 1, participacao: at / totGrupo,
            });
          }
        }
      }
      return out;
    },
  });

  dash.calc('anual', {
    inputs: ['vendas'],
    title: 'Faturamento por ano',
    description: 'Soma de cada loja (e de todas) em cada ano; o ano corrente é parcial.',
    fn: (vendas) => {
      const by = new Map();
      for (const d of vendas) for (const l of ['Todas', d.loja]) {
        const a = Number(d.ano), k = l + '|' + a;
        const o = by.get(k) || { loja: l, ano: a, faturamento: 0, meses: new Set() };
        o.faturamento += Number(d.faturamento); o.meses.add(Number(d.mes_num)); by.set(k, o);
      }
      return [...by.values()].sort((a, b) => a.ano - b.ano).map((o) => ({ loja: o.loja, ano: o.ano, faturamento: o.faturamento, meses: o.meses.size }));
    },
  });

  dash.calc('mensal', {
    inputs: ['vendas'],
    title: 'Faturamento mensal',
    description: 'Faturamento de cada loja (e de todas) em cada mês.',
    fn: (vendas) => {
      const by = new Map();
      for (const d of vendas) for (const l of ['Todas', d.loja]) {
        const a = Number(d.ano), m = Number(d.mes_num), k = `${l}|${a}|${m}`;
        const o = by.get(k) || { loja: l, ano: a, mes_num: m, faturamento: 0 };
        o.faturamento += Number(d.faturamento); by.set(k, o);
      }
      return [...by.values()].sort((a, b) => a.ano - b.ano || a.mes_num - b.mes_num);
    },
  });

  dash.calc('por_loja', {
    inputs: ['vendas'],
    title: 'Acumulado do ano por loja',
    description: 'Para cada ano e mês de referência: cada loja no acumulado de janeiro até o mês, contra o mesmo período do ano anterior.',
    fn: (vendas) => {
      const S = new Map(), nomes = new Map(), meses = new Map();
      for (const d of vendas) {
        const a = Number(d.ano), m = Number(d.mes_num);
        S.set(`${a}|${m}|${d.loja}`, (S.get(`${a}|${m}|${d.loja}`) || 0) + Number(d.faturamento));
        nomes.set(d.loja, d.nome); meses.set(a, Math.max(meses.get(a) || 0, m));
      }
      const g = (a, m, l) => S.get(`${a}|${m}|${l}`) || 0;
      const ytd = (a, m, l) => { let s = 0; for (let i = 1; i <= m; i++) s += g(a, i, l); return s; };
      const out = [];
      for (const [a, mMax] of meses) for (let m = 1; m <= mMax; m++) {
        const lojas = [...nomes.keys()].filter((l) => ytd(a, m, l) > 0 || ytd(a - 1, m, l) > 0);
        const total = lojas.reduce((s, l) => s + ytd(a, m, l), 0);
        for (const l of lojas) {
          const at = ytd(a, m, l), an = ytd(a - 1, m, l);
          out.push({ ano: a, mes: m, loja: l, nome: nomes.get(l), acum_atual: at, acum_anterior: an,
            variacao: an > 0 && at > 0 ? at / an - 1 : null, participacao: total > 0 ? at / total : 0, ultimo_mes: g(a, m, l) });
        }
      }
      return out;
    },
  });

  dash.calc('historia_ano', {
    inputs: ['kpis', 'anual', 'mensal', 'por_loja'],
    title: 'Mensagem do ano',
    description: 'Headline, evidências, onde agir e ressalva para cada ano, mês de referência e loja, escritas a partir dos indicadores.',
    fn: (kpis, anual, mensal, por_loja) => {
      const MES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
      const pcs = (v) => (v > 0 ? '+' : '') + (v * 100).toFixed(1).replace('.', ',') + '%';
      const p1 = (v) => (Math.abs(v) * 100).toFixed(1).replace('.', ',') + '%';
      const rs = (v) => v >= 1e6 ? 'R$ ' + (v / 1e6).toFixed(2).replace('.', ',') + ' mi' : 'R$ ' + Math.round(v / 1e3).toLocaleString('pt-BR') + ' mil';
      const idx = (arr, f) => { const m = new Map(); for (const r of arr) { const k = f(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); } return m; };
      const anualPorLoja = idx(anual, (r) => r.loja), mensalPor = idx(mensal, (r) => r.loja + '|' + r.ano), lojasPor = idx(por_loja, (r) => r.ano + '|' + r.mes);
      return kpis.map((k) => {
        const todas = k.loja === 'Todas';
        const ml = MES[k.mes - 1], Ml = ml[0].toUpperCase() + ml.slice(1);
        const lojaRow = !todas ? (lojasPor.get(k.ano + '|' + k.mes) || []).find((r) => r.loja === k.loja) : null;
        const quem = todas ? 'O grupo' : `${k.loja} ${lojaRow ? lojaRow.nome : ''}`.trim();
        const per = k.mes === 12 ? `em ${k.ano}` : `de janeiro a ${ml} de ${k.ano}`;
        const headline = k.ytd_var == null
          ? `${quem} faturou ${rs(k.ytd_atual)} ${per}.`
          : `${quem} ${k.ytd_var >= 0 ? 'cresce' : 'recua'} ${p1(k.ytd_var)} ${per}, com ${rs(k.ytd_atual)} faturados.`;
        const complemento = todas
          ? (k.lojas_fora !== 'nenhuma' && k.mesmas_lojas_var != null ? `Sem a ${k.lojas_fora}, que parou de faturar, o crescimento das mesmas lojas é de ${pcs(k.mesmas_lojas_var)}.` : `${k.lojas_ativas} lojas faturando no mês de referência.`)
          : `Responde por ${p1(k.participacao)} do faturamento do grupo no período.`;
        const atual = (mensalPor.get(k.loja + '|' + k.ano) || []).filter((m) => m.mes_num <= k.mes);
        const ant = mensalPor.get(k.loja + '|' + (k.ano - 1)) || [];
        const comp = atual.filter((m) => ant.some((q) => q.mes_num === m.mes_num));
        const acima = comp.filter((m) => m.faturamento > ant.find((q) => q.mes_num === m.mes_num).faturamento).length;
        const ativas = (lojasPor.get(k.ano + '|' + k.mes) || []).filter((l) => l.ultimo_mes > 0 && l.variacao != null).sort((a, b) => b.variacao - a.variacao);
        const top = ativas[0], low = ativas[ativas.length - 1];
        let onde;
        if (!ativas.length) onde = 'Sem comparação com o ano anterior para este período.';
        else if (todas) onde = `${low.loja} ${low.nome} tem o menor crescimento entre as lojas ativas (${pcs(low.variacao)}); ${top.loja} ${top.nome} lidera (${pcs(top.variacao)}).`;
        else {
          const pos = ativas.findIndex((l) => l.loja === k.loja) + 1;
          onde = pos > 0 ? `${pos}ª em crescimento entre as ${ativas.length} lojas ativas. ${pos === 1 ? `A seguinte é ${ativas[1] ? ativas[1].loja + ' ' + ativas[1].nome : '—'}.` : `A líder é ${top.loja} ${top.nome} (${pcs(top.variacao)}).`}` : 'Loja sem faturamento no mês de referência.';
        }
        const cheios = (anualPorLoja.get(k.loja) || []).filter((a) => a.meses === 12 && a.ano <= k.ano);
        let seq = 0; for (let i = cheios.length - 1; i > 0 && cheios[i].faturamento > cheios[i - 1].faturamento; i--) seq++;
        return {
          ano: k.ano, mes: k.mes, loja: k.loja, headline, complemento,
          evid1: k.mes_var == null ? `${Ml}: ${rs(k.mes_atual)}.` : `${Ml}: ${rs(k.mes_atual)}, ${pcs(k.mes_var)} sobre o mesmo mês de ${k.ano - 1}.`,
          evid2: comp.length ? `${k.ano} ficou acima de ${k.ano - 1} em ${acima} de ${comp.length} meses.` : `Sem meses de ${k.ano - 1} para comparar.`,
          evid3: k.total_var == null ? (k.total_fechado > 0 ? `${k.ano - 1} fechou em ${rs(k.total_fechado)}.` : `Sem ano fechado anterior na base.`) : `${k.ano - 1} fechou em ${rs(k.total_fechado)}, ${pcs(k.total_var)} sobre ${k.ano - 2}.`,
          onde_agir: onde,
          ressalva: 'Crescimento nominal: parte da alta pode vir de reajuste de preços, como o repasse das resinas, e não de volume.',
          titulo_anual: seq >= 2 ? `${todas ? 'Faturamento' : quem} cresce há ${seq} anos seguidos` : `Faturamento anual · ${todas ? 'grupo' : quem}`,
          titulo_mensal: comp.length ? `${k.ano} acima de ${k.ano - 1} em ${acima} de ${comp.length} meses` : `Mês a mês · ${k.ano}`,
        };
      });
    },
  });

  dash.calc('historia_lojas', {
    inputs: ['por_loja', 'kpis'],
    title: 'Mensagem das lojas',

    for (const y of anos) { const fim = y === ultC.slice(0, 4) ? ultC : y + '-12'; if (fim.slice(0, 4) === y) add('Anos', 'a' + y, fim.endsWith('-12') ? `Ano ${y}` : `${y} até ${MESES[Number(fim.slice(5, 7)) - 1]}`, y + '-01', fim); }

    for (const m of [...meses].reverse()) if (m <= ultC || m === parcial) add('Meses', 'm' + m, mesNome(m) + (m === parcial ? ' (em curso)' : ''), m, m);
    return ops;
  }
  function selPeriodo(sel, ops, id) {
    const ordem = [...new Set(ops.map((o) => o.grp))];
    opcoesG(sel, ordem.map((g) => [g, ops.filter((o) => o.grp === g).map((o) => [o.id, o.txt])]), id);
  }

  /* ---------- Abas ---------- */
  let aba = 'mes';
  // Duas áreas: Comercial (Mês, Ano, Lojas, Raio-X, Metas) e Financeiro (Produtos e markup, Gastos). Cada área lembra a última aba aberta.
  const ultAba = { com: "mes", fin: "produtos", rel: "relatorios" };
  const areaDe = (id) => { const b = $$('.bd-tab').find((x) => x.dataset.tab === id); return b ? b.dataset.area : 'com'; };
  function showTab(id, push) {
    if (!$$('.bd-page').some((p) => p.dataset.page === id)) return;
    aba = id;
    const area = areaDe(id); ultAba[area] = id;
    $$('.bd-area').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.area === area)));
    $$('.bd-tab').forEach((b) => { b.hidden = b.dataset.area !== area; });
    $$('.bd-tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
    $$('.bd-page').forEach((p) => { p.hidden = p.dataset.page !== id; });
    if (push) { dash.setLink(id); window.scrollTo({ top: 0 }); }
    render();
  }
  $$('.bd-tab').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab, true)));
  $$('.bd-area').forEach((b) => b.addEventListener('click', () => showTab(ultAba[b.dataset.area], true)));

  /* ---------- Gráficos ---------- */
  function drawCurva(el, rows) {
    el.replaceChildren();
    if (!rows.length) return;
    const W = Math.max(280, el.clientWidth), H = 260;
    const svg = d3.select(el).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const N = rows.length;
    const top = d3.max(rows, (r) => Math.max(r.esperado_gerente, r.projecao || 0, r.realizado || 0)) * 1.06;
    const y = d3.scaleLinear([0, top], [H - 26, 12]).nice();
    const ticks = y.ticks(4);
    const ml = d3.max(ticks, (t) => measure(svg, mi(t))) + 10;
    const mr = d3.max(['Meta gerente', 'Meta loja', 'Projeção'], (t) => measure(svg, t)) + 14;
    const x = d3.scaleLinear([0, N], [ml, W - mr]);
    for (const t of ticks) {
      svg.append('line').attr('x1', ml).attr('x2', W - mr).attr('y1', y(t)).attr('y2', y(t)).style('stroke', 'var(--cds-chart-grid)');
      svg.append('text').attr('x', ml - 8).attr('y', y(t)).attr('dy', '0.32em').attr('text-anchor', 'end').attr('font-size', 12).style('fill', 'var(--color-fg-muted)').text(mi(t));
    }
    const step = W < 480 ? 7 : 5;
    for (let d = 1; d <= N; d += step) svg.append('text').attr('x', x(d)).attr('y', H - 6).attr('text-anchor', 'middle').attr('font-size', 12).style('fill', 'var(--color-fg-muted)').text(String(d).padStart(2, '0'));
    const ln = (f) => d3.line().defined((r) => r[f] != null).x((r) => x(r.dia)).y((r) => y(r[f]));
    svg.append('path').datum(rows).attr('d', ln('esperado_gerente')).style('fill', 'none').style('stroke', MUTED).attr('stroke-width', 1.5).attr('stroke-dasharray', '2 4').attr('stroke-linecap', 'round');
    svg.append('path').datum(rows).attr('d', ln('esperado_loja')).style('fill', 'none').style('stroke', 'var(--color-fg)').attr('stroke-width', 1.4).attr('stroke-dasharray', '6 4').style('opacity', 0.75);
    svg.append('path').datum(rows).attr('d', ln('projecao')).style('fill', 'none').style('stroke', GOLD).attr('stroke-width', 1.8).attr('stroke-dasharray', '4 4').style('opacity', 0.8);
    const pts = [{ dia: 0, realizado: 0 }, ...rows.filter((r) => r.realizado != null)];
    const grad = 'g' + Math.random().toString(36).slice(2, 8);
    const lg = svg.append('defs').append('linearGradient').attr('id', grad).attr('x1', 0).attr('x2', 0).attr('y1', 0).attr('y2', 1);
    [[0, 0.28], [0.5, 0.1], [1, 0]].forEach(([o, a]) => lg.append('stop').attr('offset', o).style('stop-color', '#AF6839').style('stop-opacity', a));
    svg.append('path').datum(pts).attr('d', d3.area().x((r) => x(r.dia)).y0(y(0)).y1((r) => y(r.realizado))).style('fill', `url(#${grad})`);
    svg.append('path').datum(pts).attr('d', d3.line().x((r) => x(r.dia)).y((r) => y(r.realizado))).style('fill', 'none').style('stroke', GOLD).attr('stroke-width', 3).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');
    svg.append('g').selectAll('circle').data(pts.slice(1)).join('circle').attr('cx', (r) => x(r.dia)).attr('cy', (r) => y(r.realizado)).attr('r', 4.5).style('fill', GOLD).style('stroke', 'var(--color-panel)').attr('stroke-width', 2);
    const last = rows[N - 1];
    const ends = [
      { t: 'Meta gerente', v: last.esperado_gerente, c: 'var(--color-fg-muted)' },
      { t: 'Meta loja', v: last.esperado_loja, c: 'var(--color-fg)' },
      { t: 'Projeção', v: last.projecao, c: GOLD },
    ].filter((e) => e.v != null).map((e) => ({ ...e, ly: y(e.v) })).sort((a, b) => a.ly - b.ly);
    for (let i = 1; i < ends.length; i++) if (ends[i].ly - ends[i - 1].ly < 14) ends[i].ly = ends[i - 1].ly + 14;
    for (const e of ends) svg.append('text').attr('x', W - mr + 6).attr('y', e.ly).attr('dy', '0.32em').attr('font-size', 12).attr('font-weight', 700).style('fill', e.c).text(e.t);
    const rule = svg.append('line').attr('y1', 12).attr('y2', H - 26).style('stroke', 'var(--cds-chart-reference)').style('opacity', 0);
    const tip = tooltip(el);
    svg.append('rect').attr('x', ml).attr('width', W - ml - mr).attr('y', 0).attr('height', H - 20).style('fill', 'transparent')
      .on('pointermove pointerdown', (ev) => {
        const [px] = d3.pointer(ev);
        const d = Math.max(1, Math.min(N, Math.round(x.invert(px))));
        const r = rows[d - 1];
        rule.attr('x1', x(d)).attr('x2', x(d)).style('opacity', 1);
        const lines = [];
        if (r.realizado != null) lines.push({ color: GOLD, text: 'Leitura  ' + brl.format(r.realizado) });
        else if (r.projecao != null) lines.push({ color: GOLD, text: 'Projeção  ' + brl.format(r.projecao) });
        lines.push({ color: 'var(--color-fg)', text: 'Meta loja  ' + brl.format(r.esperado_loja) });
        lines.push({ color: MUTED, text: 'Meta gerente  ' + brl.format(r.esperado_gerente) });
        tipLines(tip, 'Dia ' + String(d).padStart(2, '0'), lines);
        tip.hidden = false;
        const [ex, ey] = d3.pointer(ev, el);
        placeTip(el, tip, ex, Math.max(ey, 90));
      })
      .on('pointerleave', () => { tip.hidden = true; rule.style('opacity', 0); });
  }

  // Barras horizontais genéricas: [{ key, label, value, ref?, color }]
  function drawHBars(el, data, o = {}) {
    el.replaceChildren();
    if (!data.length) { vazio(el, 'Sem dados para os filtros escolhidos.'); return; }
    const fmt = o.fmt || pct0;
    const W = Math.max(260, el.clientWidth), bh = o.bh || 26, H = data.length * bh + (o.refLine != null || o.zeroLabel ? 30 : 12);
    const svg = d3.select(el).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const ml = d3.max(data, (r) => measure(svg, r.label)) + 10;
    const vals = data.flatMap((r) => [r.value, r.ref ?? r.value, o.refLine ?? r.value]);
    const lo = Math.min(0, d3.min(vals)), hi = Math.max(0, d3.max(vals), o.minHi || 0);
    const lbw = d3.max(data, (r) => measure(svg, fmt(r.value), 12)) + 8;
    const x = d3.scaleLinear([lo < 0 ? lo * 1.1 : 0, hi * 1.05], [ml + (lo < 0 ? lbw : 0), W - lbw]);
    const yb = d3.scaleBand(data.map((r) => r.key), [6, data.length * bh + 6]).padding(0.28);
    const g = svg.append('g').selectAll('g').data(data).join('g');
    if (o.onClick) g.style('cursor', 'pointer').on('click', (ev, r) => o.onClick(r));
    g.append('text').attr('x', ml - 8).attr('y', (r) => yb(r.key) + yb.bandwidth() / 2).attr('dy', '0.32em').attr('text-anchor', 'end').attr('font-size', 12)
      .attr('font-weight', (r) => r.bold ? 700 : 400).style('fill', 'var(--color-fg)').text((r) => r.label);
    g.append('rect').attr('x', (r) => x(Math.min(0, r.value))).attr('y', (r) => yb(r.key)).attr('height', yb.bandwidth())
      .attr('width', (r) => Math.max(2, Math.abs(x(r.value) - x(0)))).attr('rx', 3).style('fill', (r) => r.color || MUTED);
    g.filter((r) => r.ref != null).append('line').attr('x1', (r) => x(r.ref)).attr('x2', (r) => x(r.ref))
      .attr('y1', (r) => yb(r.key) - 3).attr('y2', (r) => yb(r.key) + yb.bandwidth() + 3).style('stroke', 'var(--color-fg)').attr('stroke-width', 2);
    g.append('text').attr('x', (r) => r.value < 0 ? x(r.value) - 6 : x(Math.max(r.value, r.ref ?? r.value)) + 6).attr('text-anchor', (r) => r.value < 0 ? 'end' : 'start')
      .attr('y', (r) => yb(r.key) + yb.bandwidth() / 2).attr('dy', '0.32em').attr('font-size', 12).attr('font-weight', 700)
      .style('fill', (r) => r.color === BAD ? BAD : 'var(--color-fg)').text((r) => fmt(r.value));
    if (lo < 0) svg.append('line').attr('x1', x(0)).attr('x2', x(0)).attr('y1', 2).attr('y2', H - 20).style('stroke', 'var(--cds-chart-axis)');
    if (o.refLine != null) {
      svg.append('line').attr('x1', x(o.refLine)).attr('x2', x(o.refLine)).attr('y1', 2).attr('y2', H - 20).style('stroke', 'var(--color-fg)').attr('stroke-dasharray', '4 3').style('opacity', 0.7);
      svg.append('text').attr('x', x(o.refLine)).attr('y', H - 4).attr('text-anchor', 'middle').attr('font-size', 11).style('fill', 'var(--color-fg-muted)').text(o.refLabel || '');
    }
    if (o.tip) {
      const tip = tooltip(el);
      g.append('rect').attr('x', 0).attr('width', W).attr('y', (r) => yb(r.key) - 2).attr('height', yb.bandwidth() + 4).style('fill', 'transparent')
        .on('pointermove pointerdown', (ev, r) => { tipLines(tip, r.label, o.tip(r)); tip.hidden = false; const [px, py] = d3.pointer(ev, el); placeTip(el, tip, px, py); })
        .on('pointerleave', () => { tip.hidden = true; });
    }
  }

  // Duas barras por categoria (ex.: % de pedidos e % do faturamento)

    g.append('rect').attr('x', ml).attr('y', (r) => yb(r.key)).attr('height', h).attr('width', (r) => Math.max(1, x(r.a) - ml)).attr('rx', 2).style('fill', MUTED);
    g.append('rect').attr('x', ml).attr('y', (r) => yb(r.key) + h + 2).attr('height', h).attr('width', (r) => Math.max(1, x(r.b) - ml)).attr('rx', 2).style('fill', GOLD);
    g.append('text').attr('x', (r) => x(r.a) + 5).attr('y', (r) => yb(r.key) + h / 2).attr('dy', '0.35em').attr('font-size', 11).style('fill', 'var(--color-fg-muted)').text((r) => pct0(r.a));

  function drawMensal(el, rows, anoSel, proj = []) {
    el.replaceChildren();
    if (!rows.length) return;
    const W = Math.max(280, el.clientWidth), H = 250;
    const svg = d3.select(el).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const anos = [...new Set(rows.map((d) => d.ano))].sort();
    // Ano escolhido em destaque (dourado, grosso), ano anterior em vermelho mais discreto, demais anos em cinza fino
    const color = (a) => a === anoSel ? GOLD : a === anoSel - 1 ? 'var(--bin-red)' : MUTED;
    const larg = (a) => a === anoSel ? 3.4 : a === anoSel - 1 ? 2 : 1.3;
    const opac = (a) => a === anoSel ? 1 : a === anoSel - 1 ? 0.85 : 0.6;
    const fmtY = d3.max(rows, (d) => d.faturamento) < 1e6 ? mil : mi;
    const y = d3.scaleLinear([d3.min([...rows, ...proj], (d) => d.faturamento) * 0.92, d3.max([...rows, ...proj], (d) => d.faturamento) * 1.03], [H - 26, 12]).nice();
    const ticks = y.ticks(4);
    const ml = d3.max(ticks, (t) => measure(svg, fmtY(t))) + 10;
    const mr = d3.max(anos, (a) => measure(svg, String(a))) + 12;
    const x = d3.scalePoint(d3.range(1, 13), [ml, W - mr]).padding(0.2);
    for (const t of ticks) {
      svg.append('line').attr('x1', ml).attr('x2', W - mr).attr('y1', y(t)).attr('y2', y(t)).style('stroke', 'var(--cds-chart-grid)');
      svg.append('text').attr('x', ml - 8).attr('y', y(t)).attr('dy', '0.32em').attr('text-anchor', 'end').attr('font-size', 12).style('fill', 'var(--color-fg-muted)').text(fmtY(t));
    }
    const step = W < 480 ? 2 : 1;
    for (let mth = 1; mth <= 12; mth += step) svg.append('text').attr('x', x(mth)).attr('y', H - 6).attr('text-anchor', 'middle').attr('font-size', 12).style('fill', 'var(--color-fg-muted)').text(MESES[mth - 1]);
    const line = d3.line().x((d) => x(d.mes_num)).y((d) => y(d.faturamento));
    const series = anos.map((a) => ({ ano: a, pts: rows.filter((d) => d.ano === a) }));
    for (const s of series) svg.append('path').datum(s.pts).attr('d', line).style('fill', 'none').style('stroke', color(s.ano)).style('stroke-opacity', opac(s.ano)).attr('stroke-width', larg(s.ano)).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');
    // Projeção do ano escolhido: azul tracejado, partindo do último mês realizado
    const sel = series.find((s) => s.ano === anoSel);
    if (proj.length && sel && sel.pts.length) {
      const pp = [sel.pts[sel.pts.length - 1], ...proj];
      svg.append('path').datum(pp).attr('d', line).style('fill', 'none').style('stroke', PROJ).attr('stroke-width', 2.6).attr('stroke-dasharray', '6 5').attr('stroke-linecap', 'round');
      for (const p of proj) svg.append('circle').attr('cx', x(p.mes_num)).attr('cy', y(p.faturamento)).attr('r', 3.2).style('fill', 'var(--color-panel)').style('stroke', PROJ).attr('stroke-width', 1.8);
      const lp = proj[proj.length - 1];
      svg.append('text').attr('x', x(lp.mes_num)).attr('y', y(lp.faturamento) - 10).attr('text-anchor', 'end').attr('font-size', 11).attr('font-weight', 700).style('fill', PROJ).text('projeção');
    }
    const ends = series.map((s) => { const p = s.pts[s.pts.length - 1]; return { ano: s.ano, x: x(p.mes_num), y: y(p.faturamento) }; });
    for (const e of ends) svg.append('circle').attr('cx', e.x).attr('cy', e.y).attr('r', e.ano === anoSel ? 4.5 : e.ano === anoSel - 1 ? 3.5 : 2.5).style('fill', color(e.ano)).style('fill-opacity', opac(e.ano));
    const lab = ends.map((e) => ({ ...e, ly: e.y })).sort((a, b) => a.ly - b.ly);
    for (let i = 1; i < lab.length; i++) if (lab[i].ly - lab[i - 1].ly < 14) lab[i].ly = lab[i - 1].ly + 14;
    for (const e of lab) {
      const lx = e.x < W - mr - 20 ? e.x + 8 : W - mr + 6;
      svg.append('text').attr('x', lx).attr('y', e.ly).attr('dy', '0.32em').attr('font-size', 12).attr('font-weight', e.ano === anoSel ? 700 : 400).style('fill', color(e.ano)).text(String(e.ano));
    }
    const rule = svg.append('line').attr('y1', 12).attr('y2', H - 26).style('stroke', 'var(--cds-chart-reference)').style('opacity', 0);
    const dots = svg.append('g');
    const tip = tooltip(el);

    const ate = mesesAno.includes(Number(prm[keyAte])) ? Number(prm[keyAte]) : mesesAno[mesesAno.length - 1];
    return { anos, ano, mesesAno, ate };
  }

      if (pj) nota.append(' ', Object.assign(document.createElement('span'), { className: 'txt-proj', textContent: `Em azul, a projeção de ${MESES[pj.M]} a dez/${pj.ano}: é estimativa, não faturamento realizado.` }), ` ${pj.txtMetodo}`);
